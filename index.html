<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>稽核駐站分配</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* ===== Design Tokens ===== */
    :root {
      --color-primary:   #1f3a2e;  /* 審計墨綠 */
      --color-primary-soft: #e7ede9;
      --color-accent:    #b98a2f;  /* 認證章金 */
      --color-accent-soft: #f5edda;
      --color-pending:   #2c4a66;  /* 墨藍：待稽核 */
      --color-pending-soft: #e6ecf2;
      --color-danger:    #a13c2f;  /* 磚紅：待辦/錯誤 */
      --color-surface:   #f6f4ee;  /* 米白紙面 */
      --color-card:      #fffdf9;
      --color-text:      #1c1c1c;
      --color-muted:     #6f6b62;
      --color-border:    #d9d4c8;

      --font-display: 'Noto Serif TC', 'PingFang TC', serif;
      --font-body:    'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      --font-data:    'JetBrains Mono', 'Courier New', monospace;

      --space-1: 4px; --space-2: 8px; --space-3: 16px;
      --space-4: 24px; --space-5: 32px; --space-6: 48px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--color-surface);
      color: var(--color-text);
      line-height: 1.6;
      padding-bottom: 96px; /* 預留底部動作列空間 */
    }

    .container { max-width: 1080px; margin: 0 auto; padding: 0 var(--space-3); }
    .hidden { display: none !important; }

    /* ===== 頁首 ===== */
    .app-header {
      background: var(--color-primary);
      color: #fff;
      padding: var(--space-4) 0;
    }
    .app-header .container { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
    .app-title { font-family: var(--font-display); font-weight: 700; font-size: 24px; }
    .app-cycle {
      font-family: var(--font-data); font-size: 14px;
      color: rgba(255,255,255,.85);
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 9999px;
      padding: 2px var(--space-3);
    }

    /* 模式切換：segmented control */
    .mode-switch {
      margin-left: auto;
      display: inline-flex;
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 4px; overflow: hidden;
    }
    .mode-switch button {
      font-family: var(--font-body); font-size: 13px;
      background: none; border: none; color: rgba(255,255,255,.75);
      padding: var(--space-1) var(--space-3); cursor: pointer;
    }
    .mode-switch button.active {
      background: var(--color-accent); color: #fff; cursor: default;
    }

    /* ===== 分頁導航（簽名元素延伸：active 底部 3px 色條） ===== */
    .tab-bar { background: var(--color-card); border-bottom: 1px solid var(--color-border); }
    .tab-bar .container { display: flex; gap: var(--space-2); }
    .tab {
      font-family: var(--font-body); font-size: 15px; font-weight: 500;
      background: none; border: none; cursor: pointer;
      padding: var(--space-3) var(--space-3) calc(var(--space-3) - 3px);
      color: var(--color-muted);
      border-bottom: 3px solid transparent;
    }
    .tab.active { color: var(--color-primary); border-bottom-color: var(--color-accent); font-weight: 700; }
    .tab:hover:not(.active) { color: var(--color-text); }

    /* ===== 中心稽核項目卡片 ===== */
    .center-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: var(--space-3); margin-top: var(--space-4); }
    @media (max-width: 560px) { .center-grid { grid-template-columns: 1fr; } }

    .center-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-left-width: 3px;
      padding: var(--space-3);
      cursor: pointer;                 /* 點擊卡片開啟歷年稽核紀錄 */
    }
    .center-card:hover { border-color: var(--color-muted); }
    .center-card .record-hint { color: var(--color-primary); }
    .center-card.status-done     { border-left-color: var(--color-primary); }
    .center-card.status-planned  { border-left-color: var(--color-pending); }
    .center-card.status-pending,
    .center-card.status-overdue  { border-left-color: var(--color-danger); }
    .center-card.status-none     { border-left-color: var(--color-border); }

    .center-card .card-head { display: flex; align-items: flex-start; gap: var(--space-2); }
    .center-card .type-order { font-family: var(--font-data); font-size: 12px; color: var(--color-muted); }
    .center-card .type-name { font-weight: 700; font-size: 15px; line-height: 1.4; }

    .freq-chip {
      font-size: 12px; padding: 0 var(--space-2);
      border: 1px solid currentColor; border-radius: 9999px;
      white-space: nowrap; flex-shrink: 0;
    }
    .freq-triennial { color: var(--color-accent); }
    .freq-half      { color: var(--color-pending); }
    .freq-yearly    { color: var(--color-primary); }
    .freq-event     { color: var(--color-danger); border-style: dashed; }
    .freq-adhoc     { color: var(--color-muted); }

    /* 資料工具列（匯出／匯入） */
    .data-tools {
      display: flex; align-items: center; gap: var(--space-2);
      margin-top: var(--space-3); flex-wrap: wrap;
    }
    .data-tools-label { font-size: 13px; color: var(--color-muted); margin-right: var(--space-1); }
    .btn-tool { border: 1px solid var(--color-border); color: var(--color-primary); background: var(--color-card); }
    .btn-tool:hover { border-color: var(--color-primary); }

    /* 歷年紀錄彈窗（z-index 低於確認/補登 modal，確認對話框會疊在其上） */
    .history-overlay { z-index: 90; }
    .history-list { list-style: none; }
    .history-list li {
      display: flex; align-items: baseline; gap: var(--space-2);
      padding: var(--space-2) 0; border-bottom: 1px solid var(--color-primary-soft);
      font-size: 14px;
    }
    .history-list li:last-child { border-bottom: none; }
    .history-list .hist-main { flex: 1; line-height: 1.5; }
    .history-list .dim { color: var(--color-muted); }
    .hist-tag {
      font-family: var(--font-body); font-size: 11px;
      padding: 0 var(--space-1); margin-left: var(--space-1);
      border: 1px solid var(--color-border); border-radius: 2px; color: var(--color-muted);
      white-space: nowrap;
    }
    .hist-tag.counted { color: var(--color-primary); border-color: var(--color-primary); }
    .hist-tag.cert-in { color: var(--color-accent); border-color: var(--color-accent); }
    .hist-tag.cert-pre { color: var(--color-muted); border-style: dashed; }
    .hist-del {
      border: none; background: none; cursor: pointer; color: var(--color-danger);
      font-size: 16px; line-height: 1; padding: 0 var(--space-1); opacity: .55; flex-shrink: 0;
    }
    .hist-del:hover { opacity: 1; }
    .empty-hist { font-size: 14px; color: var(--color-muted); }

    .center-meta { font-size: 13px; color: var(--color-muted); margin-top: var(--space-2); }
    .center-meta .mono { font-family: var(--font-data); font-size: 12px; }

    /* 半年制 H1/H2 雙格迷你狀態 */
    .half-grid { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
    .half-box {
      flex: 1; border: 1px solid var(--color-border);
      padding: var(--space-1) var(--space-2);
      font-size: 12px; display: flex; justify-content: space-between; align-items: center;
    }
    .half-box .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .half-box.s-DONE .dot { background: var(--color-primary); }
    .half-box.s-PLANNED .dot { background: var(--color-pending); }
    .half-box.s-PENDING .dot, .half-box.s-OVERDUE .dot { background: var(--color-danger); }
    .half-box.s-UPCOMING .dot { background: var(--color-border); }
    .half-box.s-OVERDUE { border-color: var(--color-danger); color: var(--color-danger); }

    /* 觸發事由清單（類型 7） */
    .trigger-list { margin-top: var(--space-2); border-top: 1px dashed var(--color-border); padding-top: var(--space-2); }
    .trigger-list li {
      list-style: none; font-size: 13px;
      display: flex; gap: var(--space-2); align-items: baseline; flex-wrap: wrap;
      padding: 2px 0;
    }
    .trigger-list .t-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; align-self: center; }
    .trigger-list .open .t-dot { background: var(--color-danger); }
    .trigger-list .resolved { color: var(--color-muted); }
    .trigger-list .resolved .t-dot { background: var(--color-border); }
    .trigger-list .t-date { font-family: var(--font-data); font-size: 12px; }
    .trigger-list .t-del {
      border: none; background: none; cursor: pointer; color: inherit;
      opacity: .55; font-size: 13px; padding: 0 4px;
    }
    .trigger-list .t-del:hover { opacity: 1; }

    /* 紀錄日期 chips（沿用 year-chip 視覺，日期較長） */
    .date-chip {
      font-family: var(--font-data); font-size: 12px;
      padding: 0 var(--space-2);
      background: var(--color-primary-soft); color: var(--color-primary);
      border-radius: 2px;
      display: inline-flex; align-items: center; gap: 4px;
    }

    /* ===== 週期總覽列 ===== */
    .summary-bar {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      margin-top: var(--space-4);
      padding: var(--space-4);
      display: grid;
      grid-template-columns: 1.4fr auto auto;
      gap: var(--space-4);
      align-items: center;
    }
    @media (max-width: 880px) { .summary-bar { grid-template-columns: 1fr; } }

    .progress-label {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: var(--space-2); font-size: 14px; color: var(--color-muted);
    }
    .progress-label strong { color: var(--color-text); font-size: 16px; }
    .progress-track { height: 10px; background: var(--color-primary-soft); overflow: hidden; }
    .progress-fill { height: 100%; background: var(--color-primary); width: 0; transition: width .4s ease; }
    .progress-numbers { font-family: var(--font-data); font-size: 13px; color: var(--color-muted); margin-top: var(--space-1); }

    /* 統計卡片：今年已預計／已稽核 */
    .stat-cards { display: flex; gap: var(--space-3); }
    .stat-card {
      border: 1px solid var(--color-border);
      padding: var(--space-2) var(--space-3);
      min-width: 116px; text-align: center;
    }
    .stat-card .num { font-family: var(--font-data); font-weight: 600; font-size: 24px; display: block; line-height: 1.3; }
    .stat-card .label { font-size: 12px; color: var(--color-muted); }
    .stat-card.planned { border-top: 3px solid var(--color-pending); }
    .stat-card.planned .num { color: var(--color-pending); }
    .stat-card.audited { border-top: 3px solid var(--color-primary); }
    .stat-card.audited .num { color: var(--color-primary); }

    .suggestion-box {
      border-left: 3px solid var(--color-accent);
      background: var(--color-accent-soft);
      padding: var(--space-3) var(--space-4);
      min-width: 260px;
    }
    .suggestion-box .num { font-family: var(--font-data); font-weight: 600; font-size: 22px; color: var(--color-primary); }
    .suggestion-box .detail { font-size: 13px; color: var(--color-muted); }

    /* ===== 區段標題 ===== */
    .section-header {
      display: flex; align-items: baseline; gap: var(--space-2);
      margin: var(--space-5) 0 var(--space-3);
      border-bottom: 2px solid var(--color-primary);
      padding-bottom: var(--space-1);
    }
    .section-header h2 { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
    .section-header .count { font-family: var(--font-data); font-size: 13px; color: var(--color-muted); }
    .section-header.certified { border-bottom-color: var(--color-accent); }
    .section-hint { font-size: 13px; color: var(--color-muted); margin-left: auto; }

    /* ===== 駐站篩選工具列 ===== */
    .station-filter-panel {
      margin-top: var(--space-3);
      border: 1px solid var(--color-border);
      border-left: 3px solid var(--color-primary);
      background: var(--color-card);
      padding: var(--space-3);
      display: grid;
      grid-template-columns: minmax(260px, 1.5fr) minmax(180px, .75fr) minmax(180px, .75fr) auto;
      gap: var(--space-3);
      align-items: end;
    }
    .filter-field label {
      display: block;
      margin-bottom: var(--space-1);
      color: var(--color-muted);
      font-size: 12px;
      font-weight: 500;
    }
    .filter-control {
      width: 100%;
      height: 38px;
      border: 1px solid var(--color-border);
      border-radius: 2px;
      background: #fff;
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 14px;
      padding: var(--space-1) var(--space-2);
    }
    .filter-control:focus {
      outline: 2px solid var(--color-primary-soft);
      border-color: var(--color-primary);
    }
    .filter-search-wrap { position: relative; }
    .filter-search-wrap .filter-control {
      padding-left: 34px;
      font-family: var(--font-body);
    }
    .filter-search-wrap::before {
      content: '⌕';
      position: absolute;
      left: var(--space-2);
      bottom: 6px;
      color: var(--color-muted);
      font-family: var(--font-data);
      font-size: 18px;
      line-height: 1;
      pointer-events: none;
    }
    .filter-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-2);
      flex-wrap: wrap;
      min-width: 150px;
    }
    .filter-count {
      color: var(--color-muted);
      font-family: var(--font-data);
      font-size: 12px;
      white-space: nowrap;
    }
    .btn-filter-clear {
      border: 1px solid var(--color-border);
      color: var(--color-muted);
      background: none;
    }
    .btn-filter-clear:not(:disabled) {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .btn-filter-clear:disabled {
      opacity: .5;
      cursor: default;
    }
    @media (max-width: 900px) {
      .station-filter-panel { grid-template-columns: 1fr 1fr; }
      .filter-field.search { grid-column: 1 / -1; }
      .filter-actions { justify-content: flex-start; }
    }
    @media (max-width: 560px) {
      .station-filter-panel { grid-template-columns: 1fr; }
    }

    /* ===== 駐站卡片 ===== */
    .station-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-3); }

    .station-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-left-width: 3px;          /* 簽名元素：左緣狀態色條 */
      padding: var(--space-3);
      position: relative;
      cursor: pointer;                 /* 點擊卡片開啟歷年稽核紀錄 */
    }
    .station-card:hover { border-color: var(--color-muted); }
    .station-card.status-candidate   { border-left-color: var(--color-danger); }
    .station-card.status-done        { border-left-color: var(--color-primary); }
    .station-card.status-pending     { border-left-color: var(--color-pending); }
    .station-card.status-cycle-done  { border-left-color: var(--color-border); }
    .station-card.is-certified       { border-left-color: var(--color-accent); }
    .station-card.is-selected        { outline: 2px solid var(--color-primary); outline-offset: -1px; }

    .card-top { display: flex; align-items: flex-start; gap: var(--space-2); }
    .card-top input[type="checkbox"] {
      width: 18px; height: 18px; margin-top: 4px;
      accent-color: var(--color-primary); cursor: pointer; flex-shrink: 0;
    }
    .station-code { font-family: var(--font-data); font-size: 12px; color: var(--color-muted); }
    .station-name { font-weight: 700; font-size: 16px; }
    .station-manager { font-size: 13px; color: var(--color-muted); }

    /* 稽核履歷行：上次稽核年＋次數；逾期時整行磚紅 */
    .history-line { font-size: 13px; color: var(--color-muted); }
    .history-line .mono { font-family: var(--font-data); font-size: 12px; }
    .history-line.overdue { color: var(--color-danger); font-weight: 500; }

    .badge {
      font-size: 12px; padding: 1px var(--space-2);
      border: 1px solid currentColor; border-radius: 2px;
      white-space: nowrap; margin-left: auto; flex-shrink: 0;
    }
    .badge-candidate  { color: var(--color-danger); }
    .badge-done       { color: var(--color-primary); }
    .badge-pending    { color: var(--color-pending); background: var(--color-pending-soft); }
    .badge-draft      { color: var(--color-accent); border-style: dashed; }
    .badge-cycle-done { color: var(--color-muted); }
    .badge-certified  {
      color: var(--color-accent); border-radius: 9999px;
      margin-left: var(--space-1);
    }
    .cert-since {
      font-family: var(--font-data); font-size: 11px;
      color: var(--color-muted); margin-left: var(--space-1);
    }

    .year-chips { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-2); align-items: center; }
    .year-chip {
      font-family: var(--font-data); font-size: 12px;
      padding: 0 var(--space-2);
      background: var(--color-primary-soft); color: var(--color-primary);
      border-radius: 2px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .year-chip.counted { background: var(--color-primary); color: #fff; }
    .year-chip .chip-del {
      cursor: pointer; border: none; background: none; color: inherit;
      font-size: 13px; line-height: 1; padding: 2px;
      opacity: .55;
    }
    .year-chip .chip-del:hover { opacity: 1; }
    .due-year { font-family: var(--font-data); font-size: 12px; color: var(--color-muted); }
    .no-history { font-size: 12px; color: var(--color-muted); margin-top: var(--space-2); }

    /* 分派資訊區塊 */
    .assignment-info {
      margin-top: var(--space-2);
      padding: var(--space-2) var(--space-3);
      font-size: 13px;
      border: 1px solid var(--color-pending-soft);
      background: var(--color-pending-soft);
    }
    .assignment-info.draft { background: var(--color-accent-soft); border: 1px dashed var(--color-accent); }
    .assignment-info .date { font-family: var(--font-data); font-size: 12px; }

    .card-actions { display: flex; gap: var(--space-2); margin-top: var(--space-2); flex-wrap: wrap; }
    .btn-sm {
      font-family: var(--font-body); font-size: 13px;
      padding: var(--space-1) var(--space-3);
      border-radius: 4px; cursor: pointer;
      background: none;
    }
    .btn-sm:hover { filter: brightness(0.94); }
    .btn-assign { border: 1px solid var(--color-pending); color: var(--color-pending); }
    .btn-edit-draft { border: 1px solid var(--color-accent); color: var(--color-accent); }
    .btn-remove { border: 1px solid var(--color-border); color: var(--color-muted); }
    .btn-backfill { border: 1px solid var(--color-border); color: var(--color-muted); }

    /* 週期設定（僅固定模式顯示） */
    .cycle-settings {
      font-family: var(--font-body); font-size: 13px;
      background: none; border: 1px solid rgba(255,255,255,.35); border-radius: 9999px;
      color: rgba(255,255,255,.85); padding: 2px var(--space-3); cursor: pointer;
    }
    .cycle-settings:hover { border-color: rgba(255,255,255,.7); }
    .modal select {
      font-family: var(--font-data); font-size: 14px;
      padding: var(--space-1) var(--space-2);
      border: 1px solid var(--color-border); border-radius: 2px;
      background: #fff; color: var(--color-text);
    }
    .cycle-preview { font-family: var(--font-data); font-size: 13px; color: var(--color-primary); margin-top: var(--space-2); }

    .members-toggle {
      background: none; border: none; cursor: pointer;
      font-family: var(--font-body); font-size: 13px;
      color: var(--color-primary); text-decoration: underline;
      margin-top: var(--space-2); padding: 0;
    }
    .members-list { margin-top: var(--space-2); border-top: 1px dashed var(--color-border); padding-top: var(--space-2); }
    .members-list li {
      list-style: none; font-size: 13px;
      display: flex; gap: var(--space-2); align-items: baseline;
    }
    .members-list .title { color: var(--color-muted); font-size: 12px; }

    /* ===== 底部動作列 ===== */
    .action-bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--color-primary); color: #fff;
      padding: var(--space-3) 0;
      transform: translateY(110%);
      transition: transform .25s ease;
      z-index: 50;
    }
    .action-bar.visible { transform: translateY(0); }
    .action-bar .container { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
    .action-bar .selected-info { font-size: 14px; }
    .action-bar select {
      font-family: var(--font-data); font-size: 14px;
      padding: var(--space-1) var(--space-2);
      border: 1px solid rgba(255,255,255,.4); border-radius: 2px;
      background: var(--color-primary); color: #fff;
    }
    .btn {
      font-family: var(--font-body); font-size: 14px; font-weight: 500;
      padding: var(--space-2) var(--space-4);
      border-radius: 4px; border: none; cursor: pointer;
    }
    .btn:hover { filter: brightness(0.92); }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn-record { background: var(--color-accent); color: #fff; }
    .btn-ghost  { background: none; border: 1px solid rgba(255,255,255,.4); color: #fff; }
    .btn-cancel { background: none; border: 1px solid var(--color-border); color: var(--color-text); }
    .btn-confirm { background: var(--color-primary); color: #fff; }
    .btn-danger  { background: var(--color-danger); color: #fff; }
    .bar-spacer { margin-left: auto; display: flex; gap: var(--space-2); flex-wrap: wrap; }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(28,28,28,.45);
      display: none; align-items: center; justify-content: center; z-index: 100;
      padding: var(--space-3);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--color-card); border-top: 3px solid var(--color-accent);
      max-width: 480px; width: 100%;
      display: flex; flex-direction: column; max-height: 80vh;
    }
    .modal-header { padding: var(--space-3) var(--space-4); font-family: var(--font-display); font-weight: 600; font-size: 17px; }
    .modal-body { padding: 0 var(--space-4); overflow-y: auto; max-height: 60vh; font-size: 14px; }
    .modal-body ul { margin: var(--space-2) 0; padding-left: var(--space-4); }
    .modal-body li { font-size: 13px; }
    .modal-body .mono { font-family: var(--font-data); font-size: 12px; color: var(--color-muted); }
    .modal-footer {
      padding: var(--space-3) var(--space-4);
      display: flex; justify-content: flex-end; gap: var(--space-2);
      flex-shrink: 0;
    }

    /* 分派表單 */
    .auditor-list {
      border: 1px solid var(--color-border);
      max-height: 200px; overflow-y: auto;
      margin: var(--space-2) 0;
    }
    .auditor-list label {
      display: flex; align-items: center; gap: var(--space-2);
      padding: var(--space-2) var(--space-3); cursor: pointer;
      border-bottom: 1px solid var(--color-primary-soft);
      font-size: 14px;
    }
    .auditor-list label:last-child { border-bottom: none; }
    .auditor-list input { accent-color: var(--color-pending); width: 16px; height: 16px; }
    .auditor-list .email { font-family: var(--font-data); font-size: 11px; color: var(--color-muted); margin-left: auto; }
    .form-row { margin: var(--space-3) 0; }
    .form-row label { font-size: 13px; color: var(--color-muted); display: block; margin-bottom: var(--space-1); }
    .form-row input[type="date"] {
      font-family: var(--font-data); font-size: 14px;
      padding: var(--space-1) var(--space-2);
      border: 1px solid var(--color-border); border-radius: 2px;
      background: #fff; color: var(--color-text);
    }
    .form-error { font-size: 13px; color: var(--color-danger); min-height: 20px; }
    .period-hint { font-size: 12px; color: var(--color-muted); margin-top: var(--space-1); min-height: 18px; }
    .period-hint .warn { color: var(--color-danger); }

    /* ===== 認證駐站管理 Modal ===== */
    .modal.modal-wide { max-width: 680px; }
    .cert-stat { font-size: 14px; color: var(--color-muted); margin: var(--space-2) 0 var(--space-3); }
    .cert-stat strong { font-family: var(--font-data); font-size: 16px; color: var(--color-text); }
    .cert-stat .full { color: var(--color-primary); }
    .cert-stat .need { color: var(--color-danger); }
    .cert-section-label { font-size: 13px; color: var(--color-muted); margin: var(--space-4) 0 var(--space-1); font-weight: 500; }
    .cert-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
    .cert-slot {
      border: 1px solid var(--color-border); border-left: 3px solid var(--color-accent);
      background: var(--color-card); padding: var(--space-2) var(--space-3);
      display: flex; align-items: center; gap: var(--space-2); min-height: 58px;
    }
    .cert-slot.empty {
      border-left-color: var(--color-border); border-style: dashed;
      color: var(--color-muted); justify-content: center; font-size: 13px;
    }
    .cert-slot .info { flex: 1; min-width: 0; }
    .cert-slot .s-name { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: var(--space-1); flex-wrap: wrap; }
    .cert-slot .s-meta { font-family: var(--font-data); font-size: 11px; color: var(--color-muted); }
    .cert-slot .s-manager { font-size: 12px; color: var(--color-muted); }
    .cert-search {
      width: 100%; box-sizing: border-box; font-family: var(--font-body); font-size: 14px;
      padding: var(--space-2) var(--space-3); margin: var(--space-1) 0 var(--space-2);
      border: 1px solid var(--color-border); border-radius: 2px; background: #fff; color: var(--color-text);
    }
    .cert-option-list { border: 1px solid var(--color-border); max-height: 230px; overflow-y: auto; }
    .cert-option {
      display: flex; align-items: center; gap: var(--space-2);
      padding: var(--space-2) var(--space-3); cursor: pointer;
      border-bottom: 1px solid var(--color-primary-soft); font-size: 14px;
    }
    .cert-option:last-child { border-bottom: none; }
    .cert-option:hover { background: var(--color-primary-soft); }
    .cert-option.selected { background: var(--color-accent-soft); }
    .cert-option .check { width: 16px; flex-shrink: 0; color: var(--color-accent); font-weight: 700; }
    .cert-option .o-name { min-width: 0; }
    .cert-option .o-meta { font-family: var(--font-data); font-size: 11px; color: var(--color-muted); margin-left: auto; flex-shrink: 0; padding-left: var(--space-2); }
    .cert-empty-hint { font-size: 13px; color: var(--color-muted); padding: var(--space-3); text-align: center; }
    .cert-diff { display: flex; flex-wrap: wrap; gap: var(--space-1); margin: var(--space-3) 0 var(--space-1); min-height: 22px; }
    .cert-diff-chip {
      font-size: 12px; padding: 1px var(--space-2); border-radius: 9999px;
      border: 1px solid currentColor; white-space: nowrap;
    }
    .cert-diff-chip.add { color: var(--color-accent); }
    .cert-diff-chip.remove { color: var(--color-danger); border-style: dashed; }

    /* ===== Toast / Loading / 空狀態 ===== */
    .toast {
      position: fixed; top: var(--space-3); left: 50%; transform: translateX(-50%) translateY(-200%);
      background: var(--color-primary); color: #fff;
      padding: var(--space-2) var(--space-4); font-size: 14px;
      border-radius: 4px; z-index: 200;
      transition: transform .25s ease;
      max-width: 90vw;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--color-danger); }

    .loading-overlay {
      position: fixed; inset: 0; background: var(--color-surface);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: var(--space-3); z-index: 300;
    }
    .loading-overlay.hidden { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== 處理中進度條（置中卡片遮罩，蓋住彈窗與整頁） ===== */
    .progress-overlay {
      position: fixed; inset: 0;
      background: rgba(31, 58, 46, .32);
      display: flex; align-items: center; justify-content: center;
      z-index: 500; padding: var(--space-4);
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease;
    }
    .progress-overlay.show { opacity: 1; pointer-events: auto; }
    .progress-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-top: 3px solid var(--color-accent);
      padding: var(--space-5) var(--space-5) var(--space-4);
      width: min(420px, 90vw);
      box-shadow: 0 18px 48px rgba(31, 58, 46, .22);
      transform: translateY(8px);
      transition: transform .25s ease;
    }
    .progress-overlay.show .progress-card { transform: translateY(0); }
    .progress-seal {
      width: 40px; height: 40px; margin: 0 auto var(--space-3);
      border: 3px solid var(--color-accent-soft);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .progress-seal.done {
      animation: none; border-color: var(--color-primary);
      position: relative;
    }
    .progress-seal.done::after {
      content: '✓'; position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--color-primary); font-size: 22px; font-weight: 700;
    }
    .progress-track-lg { height: 8px; background: var(--color-primary-soft); border-radius: 4px; overflow: hidden; }
    .progress-fill-lg {
      height: 100%; width: 0; border-radius: 4px;
      background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
    }
    .progress-meta { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); margin-top: var(--space-3); }
    .progress-text { font-size: 14px; color: var(--color-text); min-height: 20px; transition: opacity .2s ease; }
    .progress-percent { font-family: var(--font-data); font-size: 13px; color: var(--color-muted); flex-shrink: 0; }

    .error-state, .empty-state {
      background: var(--color-card); border: 1px solid var(--color-border);
      padding: var(--space-5); text-align: center;
      margin-top: var(--space-4); font-size: 14px;
    }
    .error-state { border-left: 3px solid var(--color-danger); }
    .error-state .btn { margin-top: var(--space-3); }

    @media (prefers-reduced-motion: reduce) {
      .progress-fill, .action-bar, .toast, .progress-fill-lg { transition: none; }
    }

    /* ===== 唯讀檢視模式（VIEWER）：隱藏所有寫入操作入口 ===== */
    .role-tag { display: none; }
    body.role-viewer .role-tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--color-pending-soft); color: var(--color-pending);
      border: 1px solid var(--color-pending); border-radius: 4px;
      padding: 2px var(--space-2); font-size: 12px; white-space: nowrap;
    }
    body.role-viewer .card-actions,
    body.role-viewer .station-card input[type="checkbox"],
    body.role-viewer .action-bar,
    body.role-viewer #mode-switch,
    body.role-viewer #btn-cycle-settings,
    body.role-viewer #certified-stations-btn,
    body.role-viewer [data-import],
    body.role-viewer .hist-del,
    body.role-viewer #history-backfill,
    body.role-viewer .t-del { display: none !important; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="container">
      <div class="app-title">稽核駐站分配</div>
      <div class="app-cycle" id="cycle-tag">—</div>
      <span class="role-tag" id="role-tag">👁 唯讀檢視</span>
      <button class="cycle-settings" id="certified-stations-btn">★ 認證駐站管理</button>
      <button class="cycle-settings hidden" id="btn-cycle-settings">⚙ 週期設定</button>
      <div class="mode-switch" id="mode-switch">
        <button data-mode="FIXED">固定三年區段</button>
        <button data-mode="ROLLING">滾動三年</button>
      </div>
    </div>
  </header>

  <nav class="tab-bar">
    <div class="container">
      <button class="tab active" data-tab="station">駐站收案稽核</button>
      <button class="tab" data-tab="center">中心稽核項目</button>
    </div>
  </nav>

  <main class="container">
    <div id="view-station">
      <div id="summary-root"></div>
      <div class="station-filter-panel" id="station-filter-panel">
        <div class="filter-field search">
          <label for="station-search-input">關鍵字搜尋</label>
          <div class="filter-search-wrap">
            <input class="filter-control" type="search" id="station-search-input" autocomplete="off" placeholder="搜尋駐站名稱、代碼、駐站管理員、稽核狀態、分派資訊、成員…">
          </div>
        </div>
        <div class="filter-field">
          <label for="station-manager-filter">駐站管理員</label>
          <select class="filter-control" id="station-manager-filter"></select>
        </div>
        <div class="filter-field">
          <label for="station-auditor-filter">被分派稽核員</label>
          <select class="filter-control" id="station-auditor-filter"></select>
        </div>
        <div class="filter-actions">
          <span class="filter-count" id="station-filter-count"></span>
          <button class="btn-sm btn-filter-clear" id="station-filter-clear" type="button">清除篩選</button>
        </div>
      </div>
      <div class="data-tools">
        <span class="data-tools-label">駐站稽核紀錄</span>
        <button class="btn-sm btn-tool" data-export="station" data-format="csv">匯出 CSV</button>
        <button class="btn-sm btn-tool" data-export="station" data-format="xlsx">匯出 Excel</button>
        <button class="btn-sm btn-tool" data-import="station">匯入 CSV</button>
      </div>
      <div id="content-root"></div>
    </div>
    <div id="view-center" class="hidden">
      <div id="center-summary-root"></div>
      <div class="data-tools">
        <span class="data-tools-label">中心稽核紀錄</span>
        <button class="btn-sm btn-tool" data-export="center" data-format="csv">匯出 CSV</button>
        <button class="btn-sm btn-tool" data-export="center" data-format="xlsx">匯出 Excel</button>
        <button class="btn-sm btn-tool" data-import="center">匯入 CSV</button>
      </div>
      <div id="center-content-root"></div>
    </div>
  </main>

  <!-- 匯入用隱藏檔案選擇器 -->
  <input type="file" id="import-file" accept=".csv,text/csv" style="display:none">

  <!-- 歷年稽核紀錄彈窗（駐站／中心共用） -->
  <div class="modal-overlay history-overlay" id="history-overlay">
    <div class="modal">
      <div class="modal-header" id="history-title"></div>
      <div class="modal-body" id="history-body"></div>
      <div class="modal-footer">
        <button class="btn btn-cancel" id="history-close">關閉</button>
        <button class="btn btn-confirm" id="history-backfill">補登紀錄</button>
      </div>
    </div>
  </div>

  <!-- 底部動作列：有勾選駐站時滑出（登錄稽核流程） -->
  <div class="action-bar" id="action-bar">
    <div class="container">
      <span class="selected-info" id="selected-info"></span>
      <label id="year-select-wrap">稽核年度
        <select id="year-select"></select>
      </label>
      <div class="bar-spacer">
        <button class="btn btn-ghost" id="btn-clear">清除勾選</button>
        <button class="btn btn-record" id="btn-record">登錄稽核紀錄</button>
      </div>
    </div>
  </div>

  <!-- 確認 Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header" id="modal-title"></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-cancel" id="modal-cancel">取消</button>
        <button class="btn btn-confirm" id="modal-confirm"></button>
      </div>
    </div>
  </div>

  <!-- 分派 Modal -->
  <div class="modal-overlay" id="assign-overlay">
    <div class="modal">
      <div class="modal-header" id="assign-title"></div>
      <div class="modal-body">
        <p>稽核人員與預計日期可分開設定，只填其中一項也可儲存。先排日期會立即建立行事曆預約，之後補人員時會修改同一筆預約。</p>
        <div class="auditor-list" id="auditor-list"></div>
        <div class="form-row">
          <label for="assign-date">預計稽核日期（可留空）</label>
          <input type="date" id="assign-date">
        </div>
        <div class="form-error" id="assign-error"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" id="assign-cancel">取消</button>
        <button class="btn btn-confirm" id="assign-save">儲存分派</button>
      </div>
    </div>
  </div>

  <!-- 中心稽核 排定／登錄 Modal（兩種模式共用一個表單骨架） -->
  <div class="modal-overlay" id="center-form-overlay">
    <div class="modal">
      <div class="modal-header" id="center-form-title"></div>
      <div class="modal-body">
        <p id="center-form-hint"></p>
        <div class="form-row">
          <label for="center-form-date" id="center-form-date-label">日期</label>
          <input type="date" id="center-form-date">
          <div class="period-hint" id="center-form-period-hint"></div>
        </div>
        <div class="form-row">
          <label id="center-form-auditor-label">稽核人員（可複選）</label>
          <div class="auditor-list" id="center-auditor-list"></div>
        </div>
        <div class="form-row" id="center-form-reason-row">
          <label for="center-form-reason">事由說明</label>
          <input type="text" id="center-form-reason" style="width:100%;font-family:var(--font-body);font-size:14px;padding:var(--space-1) var(--space-2);border:1px solid var(--color-border);border-radius:2px;">
        </div>
        <div class="form-error" id="center-form-error"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" id="center-form-cancel">取消</button>
        <button class="btn btn-confirm" id="center-form-save"></button>
      </div>
    </div>
  </div>

  <!-- 登記觸發事由 Modal（類型 7） -->
  <div class="modal-overlay" id="trigger-overlay">
    <div class="modal">
      <div class="modal-header">登記觸發事由 — 組織與人員</div>
      <div class="modal-body">
        <p>設置許可展延、變更、倫理委員會組成或資料庫人員異動時，在此登記後即產生待辦稽核。</p>
        <div class="form-row">
          <label for="trigger-date">事件日期</label>
          <input type="date" id="trigger-date">
        </div>
        <div class="form-row">
          <label for="trigger-category">事由類別</label>
          <select id="trigger-category"></select>
        </div>
        <div class="form-row">
          <label for="trigger-desc">說明（選填）</label>
          <input type="text" id="trigger-desc" style="width:100%;font-family:var(--font-body);font-size:14px;padding:var(--space-1) var(--space-2);border:1px solid var(--color-border);border-radius:2px;">
        </div>
        <div class="form-error" id="trigger-error"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" id="trigger-cancel">取消</button>
        <button class="btn btn-confirm" id="trigger-save">登記事由</button>
      </div>
    </div>
  </div>

  <!-- 登錄完成／補登紀錄 Modal -->
  <div class="modal-overlay" id="backfill-overlay">
    <div class="modal">
      <div class="modal-header" id="backfill-title"></div>
      <div class="modal-body">
        <p>登錄實際稽核日期（預設今天；選過去日期即為補登歷史）。同一駐站每年僅計一筆，已有紀錄的年度無法登錄；完成後若有排程將自動清除。</p>
        <div class="form-row">
          <label for="backfill-date">稽核日期</label>
          <input type="date" id="backfill-date">
          <div class="period-hint" id="backfill-hint"></div>
        </div>
        <div class="form-error" id="backfill-error"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" id="backfill-cancel">取消</button>
        <button class="btn btn-confirm" id="backfill-save">登錄完成</button>
      </div>
    </div>
  </div>

  <!-- 認證駐站管理 Modal -->
  <div class="modal-overlay" id="certified-overlay">
    <div class="modal modal-wide">
      <div class="modal-header">認證駐站管理</div>
      <div class="modal-body">
        <p>維護認證駐站名單（須剛好 <strong id="cert-expected">6</strong> 家）。從下方搜尋並點選駐站加入或替換，調整後按「更新」寫入。</p>
        <div class="cert-stat" id="cert-stat"></div>
        <div class="cert-section-label">目前選定</div>
        <div class="cert-grid" id="certified-selected-list"></div>
        <div class="cert-section-label">可選駐站</div>
        <input type="text" class="cert-search" id="certified-search-input" placeholder="搜尋駐站名稱、代碼或管理員……" autocomplete="off">
        <div class="cert-option-list" id="certified-option-list"></div>
        <div class="cert-diff" id="certified-diff"></div>
        <div class="form-error" id="certified-error"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" id="certified-cancel">關閉</button>
        <button class="btn btn-confirm" id="certified-submit-btn" disabled>更新</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 初次載入：白底遮罩當背景，進度卡片（#progress-overlay）疊在其上呈現進度條 -->
  <div class="loading-overlay" id="loading"></div>

  <!-- 處理中進度條：所有寫入後端的操作送出時顯示 -->
  <div class="progress-overlay" id="progress-overlay">
    <div class="progress-card">
      <div class="progress-seal" id="progress-seal"></div>
      <div class="progress-track-lg"><div class="progress-fill-lg" id="progress-fill"></div></div>
      <div class="progress-meta">
        <span class="progress-text" id="progress-text">正在處理…</span>
        <span class="progress-percent" id="progress-percent">0%</span>
      </div>
    </div>
  </div>

  <script>
    // 本機預覽（無 GAS 環境）時載入真實的週期邏輯，讓 mock 與後端共用同一套純函式；
    // GAS 部署環境不會執行此行，邏輯一律走後端。
    // 加上時間戳避免瀏覽器快取舊版邏輯檔；CenterAudit 依賴 AuditCycle，順序載入。
    if (typeof google === 'undefined') {
      document.write('<script src="AuditCycle.js?v=' + Date.now() + '"><\/script>');
      document.write('<script src="CenterAudit.js?v=' + Date.now() + '"><\/script>');
      document.write('<script src="CsvUtil.js?v=' + Date.now() + '"><\/script>');
    }
  </script>
  <script>
    'use strict';

    // =============================================
    // 狀態
    // =============================================
    let dashboard = null;            // 後端回傳的完整資料
    let currentTab = 'station';      // 'station' | 'center'
    const selectedCodes = new Set(); // 勾選中的駐站代碼（登錄稽核用）
    const expandedCodes = new Set(); // 成員名單展開中的駐站（重繪後保留）
    const filterState = {
      query: '',
      managerKey: '',
      auditorKey: '',
    };

    const MODE_LABELS = {
      FIXED:   { cycleDone: '本週期已完成', progressTitle: '週期覆蓋進度' },
      ROLLING: { cycleDone: '效期內',       progressTitle: '三年效期覆蓋' },
    };
    const FILTER_UNSET_MANAGER = '__UNSET_MANAGER__';
    const FILTER_UNASSIGNED_AUDITOR = '__UNASSIGNED_AUDITOR__';

    // =============================================
    // 後端通訊（本機開發時自動退回假資料）
    // =============================================
    function callServer(fnName) {
      const args = Array.prototype.slice.call(arguments, 1);
      if (typeof google === 'undefined' || !google.script) {
        return mockServer(fnName, args); // 本機預覽：直接開啟 index.html 時走假資料
      }
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(function (json) {
            const res = JSON.parse(json);
            res.ok ? resolve(res.data) : reject(new Error(res.error));
          })
          .withFailureHandler(function (err) { reject(err); })
          [fnName].apply(null, args);
      });
    }

    // =============================================
    // 工具
    // =============================================
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /** UTF-8 字串 → base64（btoa 無法直接處理多位元組字元，先轉 byte）；供預覽 mock 匯出用 */
    function utf8ToBase64_(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      bytes.forEach(function (b) { binary += String.fromCharCode(b); });
      return btoa(binary);
    }

    function showToast(message, isError) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(function () { toast.className = 'toast'; }, 3600);
    }

    function debounce_(fn, ms) {
      let timer = null;
      return function () {
        const args = arguments;
        clearTimeout(timer);
        timer = setTimeout(function () { fn.apply(null, args); }, ms);
      };
    }

    function normalizeSearchText_(value) {
      return String(value == null ? '' : value).trim().toLowerCase();
    }

    function splitList_(value) {
      return String(value || '')
        .split(/[、,，]/)
        .map(function (item) { return item.trim(); })
        .filter(Boolean);
    }

    // =============================================
    // 處理中進度條（送出寫入後端時顯示，營造「正在處理」的踏實感）
    // 規格：5 秒跑到 90%、每秒輪播文字、伺服器回應後補到 100%；最短顯示 1.8 秒。
    // =============================================
    const PROGRESS_MESSAGES = {
      // 初次進入頁面的輪播文字（每秒一句，共 6 句配合 6 秒爬升動畫）
      initial: ['正在連線稽核資料來源…', '正在讀取駐站清單…', '正在整理稽核紀錄…', '正在計算週期覆蓋率…', '正在套用認證駐站狀態…', '正在準備儀表板…'],
      assign:  ['正在確認稽核人員…', '正在寫入稽核排程…', '正在同步 Google 行事曆…', '正在更新覆蓋率…', '即將完成…'],
      record:  ['正在核對稽核日期…', '正在登錄稽核紀錄…', '正在重新計算週期狀態…', '正在更新覆蓋率…', '即將完成…'],
      center:  ['正在確認稽核項目…', '正在寫入排程…', '正在同步 Google 行事曆…', '正在更新期別狀態…', '即將完成…'],
      remove:  ['正在確認操作…', '正在移除排程與行事曆事件…', '正在重新計算狀態…', '即將完成…'],
      trigger: ['正在登記觸發事由…', '正在更新組織與人員待辦…', '即將完成…'],
      global:  ['正在套用設定…', '正在重新評估所有駐站…', '正在重算覆蓋率…', '即將完成…'],
    };
    const PROGRESS_MIN_MS = 1800; // 寫入操作的最短顯示時間，確保使用者看清輪播文字
    const PROGRESS_RAMP_MS = 5000; // 寫入操作爬升到 90% 的動畫時間（初次載入會覆寫為 6 秒）
    const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const progressState = { startTime: 0, minMs: PROGRESS_MIN_MS, rotateTimer: null, settleTimer: null, active: false };

    /**
     * 顯示進度條並啟動爬升動畫。
     * @param {string[]} messages 每秒輪播的文字組
     * @param {{rampMs?:number, minMs?:number}} [opts] 覆寫爬升時間與最短顯示時間
     *        （初次載入用 6 秒／6 秒；省略則沿用寫入操作的 5 秒／1.8 秒）
     */
    function showProgress(messages, opts) {
      const overlay = document.getElementById('progress-overlay');
      const fill = document.getElementById('progress-fill');
      const text = document.getElementById('progress-text');
      const percent = document.getElementById('progress-percent');
      const seal = document.getElementById('progress-seal');
      const list = messages && messages.length ? messages : PROGRESS_MESSAGES.global;
      const rampMs = (opts && opts.rampMs) || PROGRESS_RAMP_MS;

      clearTimeout(progressState.settleTimer);
      clearInterval(progressState.rotateTimer);
      seal.className = 'progress-seal';
      progressState.startTime = Date.now();
      progressState.minMs = (opts && opts.minMs) || PROGRESS_MIN_MS; // 收尾時據此補足最短顯示
      progressState.active = true;

      // 重置到 0%（關閉 transition 避免上次的殘影回拉動畫）
      fill.style.transition = 'none';
      fill.style.width = '0%';
      percent.textContent = '0%';
      text.textContent = list[0];
      overlay.classList.add('show');

      // 下一幀啟動「rampMs 內爬到 90%」；reduced-motion 直接定位不做補間
      requestAnimationFrame(function () {
        if (prefersReducedMotion) {
          fill.style.transition = 'none';
          fill.style.width = '90%';
        } else {
          fill.style.transition = 'width ' + (rampMs / 1000) + 's cubic-bezier(.16,.84,.44,1)';
          fill.style.width = '90%';
        }
      });
      // 進度數字獨立補間（與寬度動畫脫鉤，確保百分比讀數平滑上升到 90）
      animatePercentTo_(90, rampMs);

      // 每秒輪播文字；跑完一輪停在最後一句（「即將完成…」）
      let idx = 0;
      progressState.rotateTimer = setInterval(function () {
        idx++;
        if (idx >= list.length) { clearInterval(progressState.rotateTimer); return; }
        text.style.opacity = '0';
        setTimeout(function () { text.textContent = list[idx]; text.style.opacity = '1'; }, 160);
      }, 1000);
    }

    /** 進度百分比讀數補間（純數字，與 CSS 寬度動畫分離） */
    function animatePercentTo_(target, duration) {
      const percent = document.getElementById('progress-percent');
      clearInterval(animatePercentTo_._timer);
      if (prefersReducedMotion) { percent.textContent = target + '%'; return; }
      const start = Number((percent.textContent || '0').replace('%', '')) || 0;
      const t0 = Date.now();
      animatePercentTo_._timer = setInterval(function () {
        const p = Math.min(1, (Date.now() - t0) / duration);
        const val = Math.round(start + (target - start) * p);
        percent.textContent = val + '%';
        if (p >= 1) clearInterval(animatePercentTo_._timer);
      }, 50);
    }

    /** 成功收尾：補足最短顯示後補到 100%、打勾、淡出。回傳 Promise 供串接 */
    function finishProgress() {
      return settleProgress_(true);
    }

    /** 失敗收尾：補足最短顯示後直接淡出（錯誤訊息交由 toast 呈現） */
    function failProgress() {
      return settleProgress_(false);
    }

    function settleProgress_(success) {
      return new Promise(function (resolve) {
        if (!progressState.active) { resolve(); return; }
        const elapsed = Date.now() - progressState.startTime;
        const wait = Math.max(0, progressState.minMs - elapsed);
        progressState.settleTimer = setTimeout(function () {
          clearInterval(progressState.rotateTimer);
          clearInterval(animatePercentTo_._timer);
          const overlay = document.getElementById('progress-overlay');
          const fill = document.getElementById('progress-fill');
          const text = document.getElementById('progress-text');
          const percent = document.getElementById('progress-percent');
          const seal = document.getElementById('progress-seal');

          if (success) {
            fill.style.transition = prefersReducedMotion ? 'none' : 'width .3s ease';
            fill.style.width = '100%';
            percent.textContent = '100%';
            seal.className = 'progress-seal done';
            text.textContent = '處理完成';
          }
          // 短暫停留讓「完成」可見，再淡出
          setTimeout(function () {
            overlay.classList.remove('show');
            progressState.active = false;
            resolve();
          }, success ? 420 : 0);
        }, wait);
      });
    }

    /**
     * 統一寫入流程（部分更新版）：進度條 → 等後端 → 收尾 → 套用單卡更新 → toast。
     * @param {string[]} messages 輪播文字組
     * @param {Promise} promise callServer(...) 回傳的 Promise
     * @param {Function} applyDelta 成功時的部分更新函式（applyStationDelta／applyCenterDelta）
     */
    function runWrite(messages, promise, applyDelta) {
      showProgress(messages);
      return promise
        .then(function (result) {
          return finishProgress().then(function () {
            applyDelta(result);
            if (result && result.message) showToast(result.message, false);
          });
        })
        .catch(function (err) {
          return failProgress().then(function () { showToast(err.message, true); });
        });
    }

    /**
     * 統一寫入流程（全量重載版）：用於影響全部駐站的全域操作（模式切換／起始年／匯入）。
     * 進度條期間於背景重抓並重繪整頁，收尾後才淡出，避免二次 loading 閃爍。
     */
    function runWriteReload(messages, promise) {
      showProgress(messages);
      let msg = '';
      return promise
        .then(function (result) { msg = result && result.message; return fetchAndRender_(); })
        .then(function () { return finishProgress(); })
        .then(function () { if (msg) showToast(msg, false); })
        .catch(function (err) { return failProgress().then(function () { showToast(err.message, true); }); });
    }

    // =============================================
    // 載入與渲染
    // =============================================
    function loadDashboard() {
      // 初次載入改用進度條：白底遮罩當背景，進度卡片 6 秒爬到 90%、每秒換一句文字，
      // 後端回應後補到 100%（最短顯示 6 秒，營造資料處理感）。背景非同步抓資料並重繪。
      const loading = document.getElementById('loading');
      loading.classList.remove('hidden');
      showProgress(PROGRESS_MESSAGES.initial, { rampMs: 6000, minMs: 6000 });
      fetchAndRender_()
        .then(function () {
          return finishProgress().then(function () { loading.classList.add('hidden'); });
        })
        .catch(function (err) {
          return failProgress().then(function () {
            loading.classList.add('hidden'); // 失敗也要拆掉遮罩，避免卡住
            renderError(err.message);
          });
        });
    }

    /** 抓取並重繪整份儀表板（不管理 loading 遮罩，供 loadDashboard 與全域寫入共用） */
    function fetchAndRender_() {
      return callServer('getAuditDashboard').then(function (data) {
        dashboard = data;
        pruneStaleSelections_();
        renderAll();
        refreshHistoryBody_(); // 歷年彈窗開著時，以最新資料更新清單
      });
    }

    /** 重載後清掉已不存在或已不適用的勾選 */
    function pruneStaleSelections_() {
      const byCode = {};
      allStations().forEach(s => { byCode[s.code] = s; });
      Array.from(selectedCodes).forEach(function (code) {
        if (!byCode[code] || !isSelectable(byCode[code])) selectedCodes.delete(code);
      });
    }

    function allStations() {
      return dashboard.certifiedStations.concat(dashboard.normalStations);
    }

    // 勾選資格集中判定：篩選、渲染、批次登錄共用
    function isSelectable(station) {
      return !station.evaluation.auditedThisYear;
    }

    function hasStationFilters_() {
      return Boolean(filterState.query || filterState.managerKey || filterState.auditorKey);
    }

    function stationManagerKey_(station) {
      const name = String(station.managerName || '').trim();
      return name || FILTER_UNSET_MANAGER;
    }

    function stationManagerLabel_(key) {
      return key === FILTER_UNSET_MANAGER ? '未設定' : key;
    }

    function stationAuditorKeys_(station) {
      const assignment = station.assignment;
      if (!assignment) return [];

      const emails = splitList_(assignment.auditorEmails).map(function (email) {
        return normalizeSearchText_(email);
      });
      if (emails.length > 0) return emails;

      return splitList_(assignment.auditorNames).map(function (name) {
        return 'name:' + name;
      });
    }

    function stationAuditorOptionMap_() {
      const options = {};
      const auditorNameByEmail = {};
      (dashboard.auditors || []).forEach(function (auditor) {
        const email = normalizeSearchText_(auditor.email);
        if (email) auditorNameByEmail[email] = auditor.name || auditor.email;
      });

      allStations().forEach(function (station) {
        const assignment = station.assignment;
        if (!assignment) return;
        const emails = splitList_(assignment.auditorEmails).map(normalizeSearchText_);
        const names = splitList_(assignment.auditorNames);

        if (emails.length > 0) {
          emails.forEach(function (email, index) {
            if (!email) return;
            options[email] = options[email] || auditorNameByEmail[email] || names[index] || email;
          });
          return;
        }

        names.forEach(function (name) {
          options['name:' + name] = name;
        });
      });
      return options;
    }

    function statusLabelForSearch_(station) {
      return statusBadge_(station).label;
    }

    function stationSearchIndex_(station) {
      const assignment = station.assignment || {};
      const memberText = (station.members || []).map(function (member) {
        return [member.name, member.email, member.title].join(' ');
      }).join(' ');
      const recordText = (station.auditRecords || []).map(function (record) {
        return [record.year, record.auditDate].join(' ');
      }).join(' ');
      const certifiedText = station.isCertified
        ? 'ISO 認證 認證駐站 認證自 ' + (station.certifiedSince || '')
        : '一般駐站';

      return normalizeSearchText_([
        station.code,
        station.name,
        station.alias,
        '駐站管理員',
        station.managerName,
        station.managerEmail,
        certifiedText,
        statusLabelForSearch_(station),
        station.lastAuditDisplay,
        recordText,
        assignment.auditorNames,
        assignment.auditorEmails,
        assignment.plannedDate,
        memberText,
      ].join(' '));
    }

    function stationMatchesFilters_(station) {
      if (filterState.managerKey && stationManagerKey_(station) !== filterState.managerKey) return false;

      if (filterState.auditorKey) {
        const keys = stationAuditorKeys_(station);
        if (filterState.auditorKey === FILTER_UNASSIGNED_AUDITOR) {
          if (keys.length > 0) return false;
        } else if (keys.indexOf(filterState.auditorKey) === -1) {
          return false;
        }
      }

      if (filterState.query && stationSearchIndex_(station).indexOf(filterState.query) === -1) return false;
      return true;
    }

    function filteredStations_() {
      return allStations().filter(stationMatchesFilters_);
    }

    function filteredStationGroups_() {
      const certified = dashboard.certifiedStations.filter(stationMatchesFilters_);
      const normal = dashboard.normalStations.filter(stationMatchesFilters_);
      return { certified: certified, normal: normal, total: certified.length + normal.length };
    }

    function renderStationFilterControls() {
      const managerSelect = document.getElementById('station-manager-filter');
      const auditorSelect = document.getElementById('station-auditor-filter');
      const searchInput = document.getElementById('station-search-input');

      searchInput.value = filterState.query;

      const managerKeys = Array.from(new Set(allStations().map(stationManagerKey_)))
        .sort(function (a, b) { return stationManagerLabel_(a).localeCompare(stationManagerLabel_(b), 'zh-Hant'); });
      managerSelect.innerHTML =
        '<option value="">全部管理員</option>' +
        managerKeys.map(function (key) {
          return '<option value="' + escapeHtml(key) + '">' + escapeHtml(stationManagerLabel_(key)) + '</option>';
        }).join('');
      managerSelect.value = managerKeys.indexOf(filterState.managerKey) === -1 ? '' : filterState.managerKey;
      filterState.managerKey = managerSelect.value;

      const auditorOptions = stationAuditorOptionMap_();
      const auditorKeys = Object.keys(auditorOptions)
        .sort(function (a, b) { return String(auditorOptions[a]).localeCompare(String(auditorOptions[b]), 'zh-Hant'); });
      auditorSelect.innerHTML =
        '<option value="">全部稽核員</option>' +
        '<option value="' + FILTER_UNASSIGNED_AUDITOR + '">未分派</option>' +
        auditorKeys.map(function (key) {
          return '<option value="' + escapeHtml(key) + '">' + escapeHtml(auditorOptions[key]) + '</option>';
        }).join('');
      auditorSelect.value = (filterState.auditorKey === FILTER_UNASSIGNED_AUDITOR || auditorKeys.indexOf(filterState.auditorKey) !== -1)
        ? filterState.auditorKey
        : '';
      filterState.auditorKey = auditorSelect.value;

      updateStationFilterMeta_();
    }

    function updateStationFilterMeta_() {
      const countEl = document.getElementById('station-filter-count');
      const clearBtn = document.getElementById('station-filter-clear');
      const matched = filteredStations_().length;
      const total = allStations().length;
      countEl.textContent = matched + ' / ' + total + ' 間';
      clearBtn.disabled = !hasStationFilters_();
    }

    function renderFilteredStationView_() {
      renderSections();
      updateStationFilterMeta_();
    }

    function clearStationFilters_() {
      filterState.query = '';
      filterState.managerKey = '';
      filterState.auditorKey = '';
      renderStationFilterControls();
      renderSections();
    }

    function renderAll() {
      // 唯讀檢視：以 body class 統一隱藏寫入入口；CSS 控制故部分更新重建卡片後仍生效
      document.body.classList.toggle('role-viewer', dashboard.userRole === 'VIEWER');
      const isRolling = dashboard.mode === 'ROLLING';
      document.getElementById('cycle-tag').textContent = isRolling
        ? '滾動式三年　·　' + dashboard.currentYear + ' 年度'
        : dashboard.cycle.start + '–' + dashboard.cycle.end + ' 週期　·　' + dashboard.currentYear + ' 年度';
      document.getElementById('mode-switch').querySelectorAll('button').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.mode === dashboard.mode);
      });
      // 起始年設定只對固定模式有意義，滾動模式時隱藏
      document.getElementById('btn-cycle-settings').classList.toggle('hidden', isRolling);
      renderSummary();
      renderStationFilterControls();
      renderSections();
      renderCenter();
      renderYearOptions();
      updateActionBar();
    }

    // =============================================
    // 分頁切換
    // =============================================
    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        currentTab = tab.dataset.tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
        document.getElementById('view-station').classList.toggle('hidden', currentTab !== 'station');
        document.getElementById('view-center').classList.toggle('hidden', currentTab !== 'center');
        updateActionBar(); // 駐站動作列只在駐站分頁顯示
      });
    });

    const debouncedStationSearch_ = debounce_(function (value) {
      filterState.query = normalizeSearchText_(value);
      renderFilteredStationView_();
    }, 180);
    document.getElementById('station-search-input').addEventListener('input', function (e) {
      debouncedStationSearch_(e.target.value);
    });
    document.getElementById('station-manager-filter').addEventListener('change', function (e) {
      filterState.managerKey = e.target.value;
      renderFilteredStationView_();
    });
    document.getElementById('station-auditor-filter').addEventListener('change', function (e) {
      filterState.auditorKey = e.target.value;
      renderFilteredStationView_();
    });
    document.getElementById('station-filter-clear').addEventListener('click', clearStationFilters_);

    function renderSummary() {
      const s = dashboard.summary;
      const isRolling = dashboard.mode === 'ROLLING';
      const labels = MODE_LABELS[dashboard.mode];
      const scopeText = isRolling
        ? '效期內 ' + s.countedInCycle + ' / ' + s.totalStations + ' 間　·　今年到期待稽 ' + s.remainingNormal + ' 間'
        : '已計入 ' + s.countedInCycle + ' / ' + s.totalStations + ' 間　·　一般駐站待稽 ' + s.remainingNormal + ' 間　·　週期剩餘 ' + s.remainingYears + ' 年';

      document.getElementById('summary-root').innerHTML =
        '<div class="summary-bar">' +
          '<div>' +
            '<div class="progress-label">' +
              '<span><strong>' + labels.progressTitle + '</strong>' +
                (isRolling ? '' : '（' + dashboard.cycle.start + '–' + dashboard.cycle.end + '）') + '</span>' +
              '<span>' + s.coveragePercent + '%</span>' +
            '</div>' +
            '<div class="progress-track"><div class="progress-fill" style="width:' + s.coveragePercent + '%"></div></div>' +
            '<div class="progress-numbers">' + scopeText + '</div>' +
          '</div>' +
          '<div class="stat-cards">' +
            '<div class="stat-card planned"><span class="num">' + s.plannedThisYear + '</span><span class="label">今年已預計稽核</span></div>' +
            '<div class="stat-card audited"><span class="num">' + s.auditedThisYear + '</span><span class="label">今年已稽核</span></div>' +
          '</div>' +
          '<div class="suggestion-box">' +
            '<div>今年建議稽核 <span class="num">' + s.suggestedTotal + '</span> 間</div>' +
            '<div class="detail">一般駐站 ' + s.suggestedNormal + ' 間 ＋ 認證駐站 ' + s.suggestedCertified + ' 間（兩年一輪）</div>' +
          '</div>' +
        '</div>';
    }

    function renderSections() {
      const root = document.getElementById('content-root');
      if (allStations().length === 0) {
        root.innerHTML =
          '<div class="empty-state">尚未讀取到任何駐站。請確認 env.js 已填入 HR 試算表 ID，' +
          '且「組織架構樹」中有代碼為 GRP-CO- 開頭的節點。</div>';
        return;
      }
      const groups = filteredStationGroups_();
      if (groups.total === 0) {
        root.innerHTML =
          '<div class="empty-state">' +
            '<div><strong>沒有符合條件的駐站</strong></div>' +
            '<div>請調整關鍵字、駐站管理員或被分派稽核員篩選。</div>' +
            '<button class="btn-sm btn-filter-clear" type="button" onclick="clearStationFilters_()">清除篩選</button>' +
          '</div>';
        return;
      }
      const normalHint = dashboard.mode === 'ROLLING' ? '上次稽核後滿三年到期' : '三年週期內稽核一次';
      const cc = dashboard.certifiedCycle;
      const certifiedTitle = (dashboard.mode === 'ROLLING' || !cc)
        ? '認證駐站'
        : '認證駐站（本輪 ' + cc.start + '–' + cc.end + '）';
      const certifiedHint = dashboard.mode === 'ROLLING'
        ? '上次稽核後滿兩年到期'
        : '兩年一輪，輪內每家稽核一次';
      root.innerHTML =
        buildSection(certifiedTitle, 'certified', groups.certified, certifiedHint) +
        buildSection('一般駐站', 'normal', groups.normal, normalHint);
      bindCardEvents();
    }

    function buildSection(title, kind, stations, hint) {
      return (
        '<div class="section-header ' + kind + '">' +
          '<h2>' + title + '</h2>' +
          '<span class="count">' + stations.length + ' 間</span>' +
          '<span class="section-hint">' + hint + '</span>' +
        '</div>' +
        '<div class="station-grid">' + stations.map(buildStationCard).join('') + '</div>'
      );
    }

    function statusBadge_(station) {
      const map = {
        AUDITED_THIS_YEAR: { label: '今年已稽核', cls: 'badge-done',    card: 'status-done' },
        PENDING_AUDIT:     { label: '待稽核',     cls: 'badge-pending', card: 'status-pending' },
        CANDIDATE:         { label: '今年候選',   cls: 'badge-candidate', card: 'status-candidate' },
        CYCLE_DONE:        { label: MODE_LABELS[dashboard.mode].cycleDone, cls: 'badge-cycle-done', card: 'status-cycle-done' },
      };
      return map[station.evaluation.status] || map.CANDIDATE;
    }

    function buildStationCard(station) {
      const ev = station.evaluation;
      const badge = statusBadge_(station);
      const selectable = isSelectable(station);
      const cardClasses = ['station-card', badge.card];
      if (station.isCertified) cardClasses.push('is-certified');
      if (selectedCodes.has(station.code)) cardClasses.push('is-selected');

      // 滾動模式：一般駐站顯示下次到期年
      const dueText = (dashboard.mode === 'ROLLING' && !station.isCertified && ev.dueYear)
        ? '<span class="due-year">到期 ' + ev.dueYear + '</span>' : '';

      // 稽核履歷行：上次稽核年＋累計次數；逾期（從未稽核或滿三年）整行磚紅警示
      const history = station.history;
      let historyLine;
      if (history.auditCount === 0) {
        historyLine = '<div class="history-line overdue">⚠ 從未稽核</div>';
      } else {
        // lastAuditDisplay：有完整日期顯示 yyyy/MM/dd，早期僅年度的紀錄退回「YYYY 年」
        const base = '上次稽核：<span class="mono">' + escapeHtml(station.lastAuditDisplay) + '</span>（共 ' + history.auditCount + ' 次）';
        historyLine = history.isOverdue
          ? '<div class="history-line overdue">' + base + '　⚠ 已超過三年未稽核</div>'
          : '<div class="history-line">' + base + '</div>';
      }

      // 紀錄明細已移至歷年紀錄彈窗（點擊卡片開啟）；卡片僅保留滾動模式到期年提示
      const dueLine = dueText ? '<div class="history-line">' + dueText + '</div>' : '';

      // 分派區塊：人員與日期可獨立設定，依完整度顯示三態；
      // 「補登紀錄」不限狀態，所有卡片皆可補登歷史
      let assignmentInfoHtml = '';
      const actionButtons = [];
      const a = station.assignment;
      const hasAuditors = a && String(a.auditorNames || '').trim() !== '';
      const hasDate = a && String(a.plannedDate || '').trim() !== '';
      if (a && (hasAuditors || hasDate)) {
        let infoClass, infoBody, mainBtnLabel;
        if (hasAuditors && hasDate) {
          infoClass = '';
          infoBody = '稽核人員：' + escapeHtml(a.auditorNames) + '　<span class="date">' + escapeHtml(a.plannedDate) + '</span>';
        } else if (hasDate) {
          infoClass = ' draft';
          infoBody = '<span class="badge badge-draft">待指派人員</span>　已排定 <span class="date">' + escapeHtml(a.plannedDate) + '</span>';
        } else {
          infoClass = ' draft';
          infoBody = '<span class="badge badge-draft">待定日期</span>　稽核人員：' + escapeHtml(a.auditorNames);
        }
        // 已排程一律顯示「修改」（不論人員／日期是否完整），對齊中心稽核卡片
        mainBtnLabel = '修改';
        assignmentInfoHtml = '<div class="assignment-info' + infoClass + '">' + infoBody + '</div>';
        actionButtons.push('<button class="btn-sm btn-edit-draft" data-action="assign" data-code="' + escapeHtml(station.code) + '">' + mainBtnLabel + '</button>');
        actionButtons.push('<button class="btn-sm btn-remove" data-action="cancel-assignment" data-code="' + escapeHtml(station.code) + '">取消</button>');
      } else if (ev.status === 'CANDIDATE') {
        actionButtons.push('<button class="btn-sm btn-assign" data-action="assign" data-code="' + escapeHtml(station.code) + '">排定稽核</button>');
      }
      actionButtons.push('<button class="btn-sm btn-backfill" data-action="backfill" data-code="' + escapeHtml(station.code) + '">登錄完成／補登</button>');
      const assignmentHtml = assignmentInfoHtml + '<div class="card-actions">' + actionButtons.join('') + '</div>';

      const expanded = expandedCodes.has(station.code);
      const membersHtml = expanded
        ? '<ul class="members-list">' + (station.members.length === 0
            ? '<li class="title">此駐站在人員職務配置中沒有成員資料</li>'
            : station.members.map(function (m) {
                return '<li><span>' + escapeHtml(m.name) + '</span><span class="title">' + escapeHtml(m.title) + '</span></li>';
              }).join('')) + '</ul>'
        : '';

      return (
        '<div class="' + cardClasses.join(' ') + '" data-code="' + escapeHtml(station.code) + '">' +
          '<div class="card-top">' +
            (selectable
              ? '<input type="checkbox" data-action="select" data-code="' + escapeHtml(station.code) + '"' +
                (selectedCodes.has(station.code) ? ' checked' : '') + ' aria-label="勾選 ' + escapeHtml(station.name) + '">'
              : '') +
            '<div>' +
              '<div class="station-code">' + escapeHtml(station.code) + '</div>' +
              '<div class="station-name">' + escapeHtml(station.name) +
                (station.isCertified ? ' <span class="badge badge-certified">ISO 認證</span>' : '') +
                (station.isCertified && station.certifiedSince ? ' <span class="cert-since">認證自 ' + station.certifiedSince + '</span>' : '') + '</div>' +
              '<div class="station-manager">駐站管理員：' + escapeHtml(station.managerName || '未設定') + '</div>' +
              historyLine +
            '</div>' +
            '<span class="badge ' + badge.cls + '">' + badge.label + '</span>' +
          '</div>' +
          dueLine +
          assignmentHtml +
          '<button class="members-toggle" data-action="toggle-members" data-code="' + escapeHtml(station.code) + '">' +
            (expanded ? '收合成員名單' : '成員 ' + station.members.length + ' 人') + '</button>' +
          membersHtml +
        '</div>'
      );
    }

    function bindCardEvents() {
      // 逐卡綁定，讓部分更新（applyStationDelta）能對單張替換的卡片重新綁定，
      // 不必整段重綁、也不會重複 addEventListener。
      document.getElementById('content-root').querySelectorAll('.station-card').forEach(bindStationCardEvents);
    }

    function bindStationCardEvents(card) {
      card.querySelectorAll('[data-action]').forEach(function (el) {
        const action = el.dataset.action;
        const code = el.dataset.code;
        if (action === 'select') {
          el.addEventListener('change', function () {
            el.checked ? selectedCodes.add(code) : selectedCodes.delete(code);
            el.closest('.station-card').classList.toggle('is-selected', el.checked);
            updateActionBar();
          });
        } else if (action === 'toggle-members') {
          el.addEventListener('click', function () {
            expandedCodes.has(code) ? expandedCodes.delete(code) : expandedCodes.add(code);
            renderSections();
          });
        } else if (action === 'delete') {
          el.addEventListener('click', function () {
            confirmDeleteRecord(code, Number(el.dataset.year));
          });
        } else if (action === 'assign') {
          el.addEventListener('click', function () { openAssignModal(code); });
        } else if (action === 'backfill') {
          el.addEventListener('click', function () { openBackfillModal(code); });
        } else if (action === 'cancel-assignment') {
          el.addEventListener('click', function () { confirmCancelAssignment(code); });
        }
      });

      // 點擊卡片任意非互動區域 → 開啟歷年稽核紀錄
      card.addEventListener('click', function (e) {
        if (e.target.closest('input, button, label, .members-toggle')) return;
        openHistoryModal('station', card.dataset.code);
      });
    }

    // =============================================
    // 部分更新：以儲存 API 回傳的單卡資料就地替換，避免整頁重載
    // =============================================
    /** 屬性選擇器值轉義（駐站代碼／類型 ID 多為英數與連字號，仍防雙引號意外） */
    function attrSelector_(value) {
      return String(value).replace(/"/g, '\\"');
    }

    /** 將更新後的單站寫回記憶體 dashboard（依 code 比對，認證旗標穩定故就地替換） */
    function replaceStationInDashboard_(st) {
      const arrays = [dashboard.certifiedStations, dashboard.normalStations];
      for (let k = 0; k < arrays.length; k++) {
        const i = arrays[k].findIndex(function (s) { return s.code === st.code; });
        if (i !== -1) { arrays[k][i] = st; return; }
      }
      (st.isCertified ? dashboard.certifiedStations : dashboard.normalStations).push(st);
    }

    /**
     * 套用駐站儲存後的部分更新：替換受影響卡片 + 摘要列，保留捲動與其他卡片狀態。
     * @param {{station?: Object, stations?: Array, summary?: Object}} result
     */
    function applyStationDelta(result) {
      const updated = result && (result.stations || (result.station ? [result.station] : []));
      if (!updated || updated.length === 0) { loadDashboard(); return; } // 契約異常 → 退回全量

      updated.forEach(replaceStationInDashboard_);
      if (result.summary) dashboard.summary = result.summary;

      pruneStaleSelections_();
      renderSummary();
      renderStationFilterControls();
      renderSections();

      updateActionBar();
      refreshHistoryBody_();           // 歷年彈窗開著時同步刷新
    }

    /**
     * 套用中心項目儲存後的部分更新：替換該卡片 + 中心摘要列。
     * @param {{centerType?: Object, centerSummary?: Object}} result
     */
    function applyCenterDelta(result) {
      const ct = result && result.centerType;
      if (!ct) { loadDashboard(); return; }

      const i = dashboard.centerTypes.findIndex(function (t) { return t.id === ct.id; });
      if (i !== -1) dashboard.centerTypes[i] = ct; else dashboard.centerTypes.push(ct);
      if (result.centerSummary) dashboard.centerSummary = result.centerSummary;

      renderCenterSummary_();

      const card = document.querySelector('.center-card[data-type="' + attrSelector_(ct.id) + '"]');
      if (!card) { renderCenter(); return; }
      const temp = document.createElement('div');
      temp.innerHTML = buildCenterCard(ct);
      const newCard = temp.firstElementChild;
      card.replaceWith(newCard);
      bindCenterCardEvents(newCard);
      refreshHistoryBody_();
    }

    function renderError(message) {
      document.getElementById('content-root').innerHTML =
        '<div class="error-state">' +
          '<div><strong>資料載入失敗</strong></div>' +
          '<div>' + escapeHtml(message) + '</div>' +
          '<button class="btn btn-confirm" onclick="loadDashboard()">重新載入</button>' +
        '</div>';
      document.getElementById('summary-root').innerHTML = '';
    }

    // =============================================
    // 中心稽核項目頁（類型 2～8）
    // =============================================
    const CENTER_BADGE_MAP = {
      DONE:     { label: '本期已完成',     cls: 'badge-done',       card: 'status-done' },
      PLANNED:  { label: '待稽核・已排定', cls: 'badge-pending',    card: 'status-planned' },
      PENDING:  { label: '待排定',         cls: 'badge-candidate',  card: 'status-pending' },
      OVERDUE:  { label: '逾期未稽核',     cls: 'badge-candidate',  card: 'status-overdue' },
      NONE:     { label: '無待辦',         cls: 'badge-cycle-done', card: 'status-none' },
    };
    const HALF_STATUS_LABELS = {
      DONE: '已完成', PLANNED: '已排定', PENDING: '待稽核', OVERDUE: '逾期', UPCOMING: '未到期',
    };
    const FREQ_CHIP_CLS = {
      TRIENNIAL: 'freq-triennial', HALF_YEAR: 'freq-half', FOUR_MONTH: 'freq-half', YEARLY: 'freq-yearly',
      EVENT: 'freq-event', ADHOC: 'freq-adhoc',
    };

    function renderCenter() {
      renderCenterSummary_();
      document.getElementById('center-content-root').innerHTML =
        '<div class="center-grid">' +
        dashboard.centerTypes.slice().sort((a, b) => a.order - b.order).map(buildCenterCard).join('') +
        '</div>';
      bindCenterEvents();
    }

    /** 中心摘要列（與卡片格線分離，供部分更新單獨刷新） */
    function renderCenterSummary_() {
      const s = dashboard.centerSummary;
      document.getElementById('center-summary-root').innerHTML =
        '<div class="summary-bar" style="grid-template-columns:1fr">' +
          '<div class="stat-cards" style="flex-wrap:wrap">' +
            '<div class="stat-card"><span class="num">' + s.dueThisYear + '</span><span class="label">今年應稽（人次）</span></div>' +
            '<div class="stat-card audited"><span class="num">' + s.doneThisYear + '</span><span class="label">今年已完成</span></div>' +
            '<div class="stat-card planned"><span class="num">' + s.plannedCount + '</span><span class="label">已排定待稽</span></div>' +
            '<div class="stat-card" style="border-top:3px solid var(--color-danger)"><span class="num" style="color:var(--color-danger)">' + s.overdueOrTodoCount + '</span><span class="label">逾期／待辦</span></div>' +
          '</div>' +
        '</div>';
    }

    function buildCenterCard(type) {
      const ev = type.evaluation;
      const badge = CENTER_BADGE_MAP[ev.status] || CENTER_BADGE_MAP.PENDING;

      // 半年制：H1/H2 雙格迷你狀態
      const halfGrid = !ev.periodsThisYear ? '' :
        '<div class="half-grid">' + ev.periodsThisYear.map(function (p) {
          return '<div class="half-box s-' + p.status + '"><span><span class="dot"></span>' + p.label + '</span>' +
            '<span>' + (HALF_STATUS_LABELS[p.status] || p.status) + '</span></div>';
        }).join('') + '</div>';

      const lastLine = ev.lastAuditDate
        ? '上次稽核：<span class="mono">' + escapeHtml(ev.lastAuditDate) + '</span>（共 ' + ev.auditCount + ' 次）'
        : '尚無稽核紀錄';
      const missedWarn = ev.prevPeriodMissed ? '<span style="color:var(--color-danger)">　⚠ 上期未稽核</span>' : '';

      // 排程資訊（人員／日期可獨立設定，依完整度顯示）
      let planHtml = '';
      if (type.plan) {
        const pHasDate = String(type.plan.plannedDate || '').trim() !== '';
        const pHasAuditors = String(type.plan.auditorNames || '').trim() !== '';
        const reasonHtml = type.plan.reason ? '　<span class="date">' + escapeHtml(type.plan.reason) + '</span>' : '';
        let pClass, pBody;
        if (pHasDate && pHasAuditors) {
          pClass = '';
          pBody = '排定 <span class="date">' + escapeHtml(type.plan.plannedDate) + '</span>　' + escapeHtml(type.plan.auditorNames);
        } else if (pHasDate) {
          pClass = ' draft';
          pBody = '<span class="badge badge-draft">待指派人員</span>　已排定 <span class="date">' + escapeHtml(type.plan.plannedDate) + '</span>';
        } else {
          pClass = ' draft';
          pBody = '<span class="badge badge-draft">待定日期</span>　稽核人員：' + escapeHtml(type.plan.auditorNames);
        }
        planHtml = '<div class="assignment-info' + pClass + '">' + pBody + reasonHtml + '</div>';
      }

      // 觸發事由清單（類型 7）
      let triggerHtml = '';
      if (type.id === 'ORG') {
        const items = (type.triggers || []).map(function (t) {
          return '<li class="' + (t.resolved ? 'resolved' : 'open') + '">' +
            '<span class="t-dot"></span>' +
            '<span class="t-date">' + escapeHtml(t.eventDate) + '</span>' +
            '<span>' + escapeHtml(t.category) + (t.description ? '：' + escapeHtml(t.description) : '') + '</span>' +
            (t.resolved
