    function openModal(config) {
      document.getElementById('modal-title').textContent = config.title;
      document.getElementById('modal-body').innerHTML = config.bodyHtml;
      const confirmBtn = document.getElementById('modal-confirm');
      confirmBtn.textContent = config.confirmLabel;
      confirmBtn.className = 'btn ' + (config.danger ? 'btn-danger' : 'btn-confirm');
      modalConfirmHandler = config.onConfirm;
      document.getElementById('modal-overlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('open');
      modalConfirmHandler = null;
    }

    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('modal-overlay').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });
    document.getElementById('modal-confirm').addEventListener('click', function () {
      if (!modalConfirmHandler) return;
      const handler = modalConfirmHandler;
      const btn = this;
      btn.disabled = true;
      handler()
        .catch(function (err) { showToast(err.message, true); })
        .finally(function () { btn.disabled = false; closeModal(); });
    });

    document.getElementById('btn-record').addEventListener('click', confirmRecordAudits);
    document.getElementById('btn-clear').addEventListener('click', function () {
      selectedCodes.clear();
      renderSections();
      updateActionBar();
    });

    // =============================================
    // 本機預覽假資料（僅在無 google.script 環境時使用）
    // 週期/候選邏輯直接呼叫 AuditCycle.js 的真實純函式，與後端一致
    // =============================================
    function mockServer(fnName, args) {
      const state = mockServer._state || (mockServer._state = {
        mode: 'FIXED',
        cycleStartYear: 2026,
        records: [
          { stationCode: 'GRP-CO-A01', year: 2026, auditDate: '2026/03/15' },
          { stationCode: 'GRP-CO-A02', year: 2025, auditDate: '2025/11/02' },
          { stationCode: 'GRP-CO-B01', year: 2026, auditDate: '2026/01/20' },
          { stationCode: 'GRP-CO-B03', year: 2026, auditDate: '' },  // 僅年度示範（早期資料）
          { stationCode: 'GRP-CO-B04', year: 2022, auditDate: '' },  // 逾期示範：距 2026 已滿三年
        ],
        assignments: [],
        // 中心稽核預置情境：半年制 H1 已稽、每年制有排程／去年漏稽／已完成、事件一開一銷、不定期一筆
        centerRecords: [
          { typeId: 'WITHDRAW', auditDate: '2026/03/10', auditorNames: '稽核·趙', reason: '', note: '' },
          { typeId: 'WITHDRAW', auditDate: '2023/09/15', auditorNames: '稽核·錢', reason: '', note: '' }, // 舊制（每半年）示範
          { typeId: 'INFOSEC',  auditDate: '2024/11/20', auditorNames: '稽核·錢', reason: '', note: '' },
          { typeId: 'DBUSE',    auditDate: '2026/01/15', auditorNames: '稽核·孫', reason: '', note: '' },
          { typeId: 'ORG',      auditDate: '2025/11/01', auditorNames: '稽核·李', reason: '設置許可展延稽核', note: '' },
          { typeId: 'ADHOC',    auditDate: '2026/02/14', auditorNames: '稽核·趙', reason: '主管機關指示專案稽核', note: '' },
        ],
        centerPlans: [
          { typeId: 'DEIDENT', plannedDate: '2026/08/15', auditorNames: '稽核·趙', auditorEmails: 'audit.chao@example.com', reason: '' },
        ],
        triggers: [
          { eventId: 'TRG-1', eventDate: '2025/10/01', category: '設置許可展延', description: '展延五年核准' },
          { eventId: 'TRG-2', eventDate: '2026/05/20', category: '資料庫人員異動', description: '新進兩名管理師' },
        ],
      });
      const stations = [
        { code: 'GRP-CO-A01', name: '台北車站駐站', managerName: '王主任', isCertified: true,  members: [{ name: '陳一', title: '駐站人員' }, { name: '林二', title: '駐站人員' }] },
        { code: 'GRP-CO-A02', name: '板橋駐站',     managerName: '李主任', isCertified: true,  members: [{ name: '張三', title: '駐站人員' }] },
        { code: 'GRP-CO-A03', name: '桃園駐站',     managerName: '吳主任', isCertified: true,  members: [] },
        { code: 'GRP-CO-B01', name: '新竹駐站',     managerName: '劉組長', isCertified: false, members: [{ name: '黃四', title: '駐站人員' }] },
        { code: 'GRP-CO-B02', name: '台中駐站',     managerName: '蔡組長', isCertified: false, members: [{ name: '許五', title: '駐站人員' }, { name: '鄭六', title: '駐站人員' }] },
        { code: 'GRP-CO-B03', name: '嘉義駐站',     managerName: '楊組長', isCertified: false, members: [] },
        { code: 'GRP-CO-B04', name: '台南駐站',     managerName: '謝組長', isCertified: false, members: [{ name: '周七', title: '駐站人員' }] },
        { code: 'GRP-CO-B05', name: '高雄駐站',     managerName: '洪組長', isCertified: false, members: [{ name: '葉八', title: '駐站人員' }] },
      ];
      const auditors = [
        { name: '稽核·趙', email: 'audit.chao@example.com' },
        { name: '稽核·錢', email: 'audit.chien@example.com' },
        { name: '稽核·孫', email: 'audit.sun@example.com' },
        { name: '稽核·李', email: 'audit.lee@example.com' },
      ];
      const currentYear = 2026;
      const cycle = getCycleForYear(currentYear, state.cycleStartYear, 3);
      const certifiedCycle = getCycleForYear(currentYear, state.cycleStartYear, 2); // 認證站兩年排程輪

      if (fnName === 'setCycleMode') {
        state.mode = args[0];
        return Promise.resolve({ mode: state.mode, message: '【預覽模式】已切換週期模式' });
      }
      if (fnName === 'setCycleStartYear') {
        state.cycleStartYear = args[0];
        return Promise.resolve({ cycleStartYear: args[0], message: '【預覽模式】已將週期起始年設為 ' + args[0] });
      }
      if (fnName === 'recordAudits') {
        // 與後端同邏輯：未帶日期且登錄今年時自動填當天
        const auditDate = args[2] || (args[1] === currentYear ? new Date().toISOString().slice(0, 10).replace(/-/g, '/') : '');
        args[0].forEach(code => state.records.push({ stationCode: code, year: args[1], auditDate: auditDate }));
        return Promise.resolve({ message: '【預覽模式】已登錄 ' + args[0].length + ' 間駐站', added: args[0].length, skipped: [] });
      }
      if (fnName === 'deleteAuditRecord') {
        const idx = state.records.findIndex(r => r.stationCode === args[0] && r.year === args[1]);
        if (idx >= 0) state.records.splice(idx, 1);
        return Promise.resolve({ message: '【預覽模式】已刪除紀錄' });
      }
      if (fnName === 'saveStationAssignment') {
        const emailToName = {};
        auditors.forEach(a => { emailToName[a.email] = a.name; });
        const code = args[0], yr = args[1];
        const emails = (args[2] || []).filter(Boolean);
        const date = String(args[3] || '').trim();
        if (emails.length === 0 && !date) {
          return Promise.reject(new Error('請至少設定稽核人員或預計稽核日期其中一項'));
        }
        const existing = state.assignments.find(p => p.stationCode === code && p.year === yr);
        const oldEventId = existing ? existing.calendarEventId : '';
        let eventId = oldEventId || '';
        let calMsg = '';
        if (date) {
          if (oldEventId) { eventId = oldEventId; calMsg = '，已更新同一日曆事件（' + eventId + '）'; }
          else { eventId = 'mock-evt-' + Date.now(); calMsg = '，已建立日曆預約（' + eventId + '）'; }
        } else {
          if (oldEventId) calMsg = '，已移除原日曆事件';
          eventId = '';
        }
        state.assignments = state.assignments.filter(p => !(p.stationCode === code && p.year === yr));
        state.assignments.push({
          stationCode: code, year: yr,
          auditorNames: emails.map(e => emailToName[e] || e).join('、'),
          auditorEmails: emails.join(','),
          plannedDate: date,
          calendarEventId: eventId,
        });
        let msg;
        if (date && emails.length > 0) msg = '【預覽模式】已分派 ' + code + calMsg;
        else if (date) msg = '【預覽模式】已排定日期（待指派人員）' + calMsg;
        else msg = '【預覽模式】已指派人員（待定日期，僅寫入試算表，尚未進日曆）';
        return Promise.resolve({ message: msg });
      }
      if (fnName === 'cancelAssignment') {
        state.assignments = state.assignments.filter(p => !(p.stationCode === args[0] && p.year === args[1]));
        return Promise.resolve({ message: '【預覽模式】已取消分派，已同步行事曆' });
      }

      // ---- 中心稽核 API（與 code.js 同邏輯的精簡版）----
      const typeNameOf = id => (AUDIT_TYPE_DEFS.find(t => t.id === id) || {}).name || id;
      const auditorNamesOf = emails => emails.map(e => (auditors.find(a => a.email === e) || { name: e }).name).join('、');
      if (fnName === 'planCenterAudit') {
        const emails = (args[1] || []).filter(Boolean);
        const date = String(args[2] || '').trim();
        if (emails.length === 0 && !date) {
          return Promise.reject(new Error('請至少設定稽核人員或預定日期其中一項'));
        }
        const existing = state.centerPlans.find(p => p.typeId === args[0]);
        const oldEventId = existing ? existing.calendarEventId : '';
        let eventId = oldEventId || '';
        let calMsg = '';
        if (date) {
          if (oldEventId) { eventId = oldEventId; calMsg = '，已更新同一日曆事件（' + eventId + '）'; }
          else { eventId = 'mock-evt-' + Date.now(); calMsg = '，已建立日曆預約（' + eventId + '）'; }
        } else { eventId = ''; if (oldEventId) calMsg = '，已移除原日曆事件'; }
        state.centerPlans = state.centerPlans.filter(p => p.typeId !== args[0]);
        state.centerPlans.push({ typeId: args[0], plannedDate: date, auditorNames: auditorNamesOf(emails), auditorEmails: emails.join(','), reason: args[3] || '', calendarEventId: eventId });
        let msg;
        if (date && emails.length > 0) msg = '【預覽模式】已排定「' + typeNameOf(args[0]) + '」於 ' + date + ' 稽核' + calMsg;
        else if (date) msg = '【預覽模式】已為「' + typeNameOf(args[0]) + '」排定日期（待指派人員）' + calMsg;
        else msg = '【預覽模式】已為「' + typeNameOf(args[0]) + '」指派人員（待定日期，尚未進日曆）';
        return Promise.resolve({ message: msg });
      }
      if (fnName === 'cancelCenterPlan') {
        state.centerPlans = state.centerPlans.filter(p => p.typeId !== args[0]);
        return Promise.resolve({ message: '【預覽模式】已取消排程，已同步行事曆' });
      }
      if (fnName === 'recordCenterAudit') {
        if (state.centerRecords.some(r => r.typeId === args[0] && r.auditDate === args[1])) {
          return Promise.reject(new Error('「' + typeNameOf(args[0]) + '」於 ' + args[1] + ' 已有紀錄，請勿重複登錄'));
        }
        state.centerRecords.push({ typeId: args[0], auditDate: args[1], auditorNames: auditorNamesOf(args[2] || []), reason: args[3] || '', note: '' });
        state.centerPlans = state.centerPlans.filter(p => p.typeId !== args[0]); // 完成後清排程
        return Promise.resolve({ message: '【預覽模式】已登錄「' + typeNameOf(args[0]) + '」於 ' + args[1] + ' 完成稽核' });
      }
      if (fnName === 'deleteCenterAuditRecord') {
        state.centerRecords = state.centerRecords.filter(r => !(r.typeId === args[0] && r.auditDate === args[1]));
        return Promise.resolve({ message: '【預覽模式】已刪除紀錄' });
      }
      if (fnName === 'addTriggerEvent') {
        state.triggers.push({ eventId: 'TRG-' + Date.now(), eventDate: args[0], category: args[1], description: args[2] || '' });
        return Promise.resolve({ message: '【預覽模式】已登記觸發事由「' + args[1] + '」' });
      }
      if (fnName === 'deleteTriggerEvent') {
        state.triggers = state.triggers.filter(t => t.eventId !== args[0]);
        return Promise.resolve({ message: '【預覽模式】已刪除觸發事由' });
      }
      if (fnName === 'exportAuditRecords' || fnName === 'importAuditRecords') {
        // 與 code.js getExportView_ 同構：駐站／中心各自的欄位、紀錄、去重鍵與寫入
        const stationNameOf = code => (stations.find(s => s.code === code) || {}).name || '';
        const view = (args[0] === 'center') ? {
          label: '中心稽核紀錄', columns: CENTER_CSV_COLUMNS,
          records: state.centerRecords.map(r => ({
            typeId: r.typeId, typeName: typeNameOf(r.typeId), auditDate: r.auditDate,
            auditorNames: r.auditorNames, reason: r.reason || '', note: r.note || '',
          })),
          keyFn: r => r.typeId + '|' + r.auditDate,
          add: rec => state.centerRecords.push({
            typeId: rec.typeId, auditDate: rec.auditDate, auditorNames: rec.auditorNames,
            reason: rec.reason || '', note: rec.note || '',
          }),
        } : {
          label: '駐站收案稽核紀錄', columns: STATION_CSV_COLUMNS,
          records: state.records.map(r => ({
            stationCode: r.stationCode, stationName: stationNameOf(r.stationCode), year: r.year,
            auditDate: r.auditDate || '', recorder: r.recorder || '', note: r.note || '',
          })),
          keyFn: r => r.stationCode + '|' + r.year,
          add: rec => state.records.push({
            stationCode: rec.stationCode, year: Number(rec.year) || rec.year,
            auditDate: rec.auditDate || '', recorder: rec.recorder || '', note: rec.note || '',
          }),
        };

        if (fnName === 'exportAuditRecords') {
          const csv = toCsv(recordsToRows(view.records, view.columns));
          const contentBase64 = btoa(unescape(encodeURIComponent('﻿' + csv)));
          const stamp = new Date().toISOString().slice(0, 10);
          return Promise.resolve({
            filename: view.label + '-' + stamp + '.csv',
            mimeType: 'text/csv', contentBase64: contentBase64,
          });
        }
        // importAuditRecords：args[1] 為 CSV 文字
        const parsed = rowsToRecords(parseCsv(args[1]), view.columns);
        if (parsed.missingHeaders.length) {
          return Promise.reject(new Error('CSV 表頭缺漏：' + parsed.missingHeaders.join('、')));
        }
        const merged = mergeImport(view.records, parsed.records, view.keyFn);
        merged.toAdd.forEach(view.add);
        return Promise.resolve({
          added: merged.toAdd.length, skipped: merged.skipped.length,
          message: '【預覽模式】已匯入 ' + merged.toAdd.length + ' 筆，跳過 ' + merged.skipped.length + ' 筆重複',
        });
      }

      // getAuditDashboard：與 code.js 相同的組裝流程
      const assignmentByStation = {};
      state.assignments.forEach(p => { if (p.year === currentYear) assignmentByStation[p.stationCode] = p; });

      const evaluated = stations.map(function (st) {
        const stationRecords = state.records.filter(r => r.stationCode === st.code);
        const years = stationRecords.map(r => r.year);
        const evaluation = evaluateStationFor_(st, years, currentYear, cycle, certifiedCycle, state.mode);
        const assignment = assignmentByStation[st.code] || null;
        if (assignment && evaluation.status !== STATION_STATUS.AUDITED_THIS_YEAR) {
          evaluation.status = STATION_STATUS.PENDING_AUDIT;
        }
        // 與後端 buildStationAuditView_ 同邏輯：倒序＋上次稽核顯示文字
        const sortedRecords = stationRecords.slice().sort(function (a, b) {
          if (a.year !== b.year) return b.year - a.year;
          return String(b.auditDate || '').localeCompare(String(a.auditDate || ''));
        });
        const latest = sortedRecords[0] || null;
        return Object.assign({}, st, {
          alias: '', managerEmail: '',
          allAuditYears: years.slice().sort(),
          auditRecords: sortedRecords.map(r => ({ year: r.year, auditDate: r.auditDate || '', recorder: 'preview@local', note: '' })),
          lastAuditDisplay: latest ? (latest.auditDate || latest.year + ' 年') : '',
          assignment: assignment && { auditorNames: assignment.auditorNames, auditorEmails: assignment.auditorEmails, plannedDate: assignment.plannedDate },
          history: buildAuditHistory(years, currentYear),
          evaluation: evaluation,
        });
      });

      const summary = buildCycleSummary(evaluated, currentYear, cycle, certifiedCycle, state.mode);
      summary.plannedThisYear = Object.keys(assignmentByStation).length;
      summary.auditedThisYear = evaluated.filter(s => s.evaluation.auditedThisYear).length;

      // 中心稽核儀表板（與 code.js 的 buildCenterDashboard_ 同流程，走真實純函式）
      const todayParts = { year: currentYear, month: new Date().getMonth() + 1 };
      const orgDates = state.centerRecords.filter(r => r.typeId === 'ORG').map(r => r.auditDate);
      const resolvedTriggers = resolveTriggerEvents(state.triggers, orgDates)
        .sort((a, b) => a.eventDate < b.eventDate ? 1 : -1);
      const openCount = resolvedTriggers.filter(t => !t.resolved).length;
      const centerTypes = AUDIT_TYPE_DEFS.filter(t => t.frequency !== 'STATION').map(function (typeDef) {
        const records = state.centerRecords.filter(r => r.typeId === typeDef.id)
          .sort((a, b) => a.auditDate < b.auditDate ? 1 : -1);
        const plan = state.centerPlans.find(p => p.typeId === typeDef.id) || null;
        const open = typeDef.id === 'ORG' ? openCount : 0;
        return {
          id: typeDef.id, order: typeDef.order, name: typeDef.name,
          frequency: typeDef.frequency, freqLabel: typeDef.freqLabel,
          records: records.map(r => Object.assign({}, r, { periodLabel: getPeriodLabelForDate(typeDef, r.auditDate) })),
          plan: plan,
          triggers: typeDef.id === 'ORG' ? resolvedTriggers : null,
          openTriggerCount: open,
          segmentSchedule: getSegmentScheduleForType(typeDef),
          evaluation: evaluateCenterType(typeDef, records.map(r => r.auditDate), plan, open, todayParts, state.cycleStartYear, state.mode),
        };
      });

      return new Promise(resolve => setTimeout(() => resolve({
        currentYear: currentYear, mode: state.mode, cycleStartYear: state.cycleStartYear, cycle: cycle, certifiedCycle: certifiedCycle, summary: summary, auditors: auditors,
        certifiedStations: evaluated.filter(s => s.isCertified),
        normalStations: evaluated.filter(s => !s.isCertified),
        centerTypes: centerTypes,
        centerSummary: buildCenterSummary(centerTypes),
        triggerCategories: TRIGGER_CATEGORIES,
        userEmail: 'preview@local',
      }), 350));
    }

    // 啟動
    loadDashboard();
  </script>
</body>
</html>
