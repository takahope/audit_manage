              ? '<span class="t-date">✓ ' + escapeHtml(t.resolvedBy) + ' 已稽核</span>'
              : '<button class="t-del" data-action="del-trigger" data-id="' + escapeHtml(t.eventId) + '" title="刪除此事由">×</button>') +
          '</li>';
        }).join('');
        triggerHtml = '<ul class="trigger-list">' +
          (items || '<li class="resolved">尚無觸發事由——有展延、變更或人員異動時在此登記</li>') + '</ul>';
      }

      // 紀錄明細已移至歷年紀錄彈窗（點擊卡片開啟）；卡片僅顯示「共 N 筆」摘要
      const recordSummary = type.records.length > 0
        ? '<div class="center-meta record-hint">歷年紀錄 ' + type.records.length + ' 筆 · 點擊查看</div>'
        : '';

      // 動作按鈕
      const actions = [];
      if (type.plan) {
        actions.push('<button class="btn-sm btn-edit-draft" data-action="plan-center" data-type="' + type.id + '">修改</button>');
        actions.push('<button class="btn-sm btn-remove" data-action="cancel-center-plan" data-type="' + type.id + '">取消</button>');
      } else if (ev.status !== 'DONE') {
        // 本期已完成（DONE）即隱藏「排定稽核」；待行事曆進入下一期、狀態回到 PENDING 才會再出現
        // （半年制以「本期」為準，故本期完成後無法預先排下一期，符合「完成即隱藏」的取捨）
        actions.push('<button class="btn-sm btn-assign" data-action="plan-center" data-type="' + type.id + '">排定稽核</button>');
      }
      actions.push('<button class="btn-sm btn-backfill" data-action="record-center" data-type="' + type.id + '">登錄完成／補登</button>');
      if (type.id === 'ORG') {
        actions.push('<button class="btn-sm btn-edit-draft" data-action="add-trigger">登記觸發事由</button>');
      }

      return (
        '<div class="center-card ' + badge.card + '" data-type="' + type.id + '">' +
          '<div class="card-head">' +
            '<div>' +
              '<div class="type-order">類型 ' + type.order + '</div>' +
              '<div class="type-name">' + escapeHtml(type.name) + ' <span class="freq-chip ' + (FREQ_CHIP_CLS[type.frequency] || '') + '"' +
                eraTooltip_(type) + '>' + escapeHtml(type.freqLabel) + '</span></div>' +
            '</div>' +
            '<span class="badge ' + badge.cls + '" style="margin-left:auto">' + badge.label + '</span>' +
          '</div>' +
          '<div class="center-meta">本期：' + escapeHtml(ev.currentPeriodLabel) + '　·　期限：' + escapeHtml(ev.nextDueLabel) + '</div>' +
          '<div class="center-meta">' + lastLine + missedWarn + '</div>' +
          halfGrid +
          planHtml +
          triggerHtml +
          recordSummary +
          '<div class="card-actions">' + actions.join('') + '</div>' +
        '</div>'
      );
    }

    function bindCenterEvents() {
      // 逐卡綁定，供 applyCenterDelta 單張替換後重新綁定。
      document.getElementById('center-content-root').querySelectorAll('.center-card').forEach(bindCenterCardEvents);
    }

    function bindCenterCardEvents(card) {
      card.querySelectorAll('[data-action]').forEach(function (el) {
        const action = el.dataset.action;
        if (action === 'plan-center') {
          el.addEventListener('click', function () { openCenterForm('plan', el.dataset.type); });
        } else if (action === 'record-center') {
          el.addEventListener('click', function () { openCenterForm('record', el.dataset.type); });
        } else if (action === 'cancel-center-plan') {
          el.addEventListener('click', function () { confirmCancelCenterPlan(el.dataset.type); });
        } else if (action === 'del-center-record') {
          el.addEventListener('click', function () { confirmDeleteCenterRecord(el.dataset.type, el.dataset.date); });
        } else if (action === 'add-trigger') {
          el.addEventListener('click', openTriggerModal);
        } else if (action === 'del-trigger') {
          el.addEventListener('click', function () { confirmDeleteTrigger(el.dataset.id); });
        }
      });

      // 點擊卡片任意非互動區域 → 開啟該類型歷年稽核紀錄
      card.addEventListener('click', function (e) {
        if (e.target.closest('button, input, label, a, .t-del')) return;
        openHistoryModal('center', card.dataset.type);
      });
    }

    // ---- 期別歸屬（分段制類型；規則資料由後端 segmentSchedule 下發） ----
    const FREQ_DISPLAY_NAMES = { FOUR_MONTH: '每四個月', HALF_YEAR: '每半年' };

    /** 頻率有年代變更的類型，chip 加 tooltip 說明（如：2024 年起每四個月；更早每半年） */
    function eraTooltip_(type) {
      const schedule = type.segmentSchedule;
      if (!schedule || schedule.length < 2) return '';
      const text = schedule.map(function (era) {
        return (era.fromYear ? era.fromYear + ' 年起' : '更早年度') + (FREQ_DISPLAY_NAMES[era.frequency] || era.frequency);
      }).join('；');
      return ' title="' + escapeHtml(text) + '"';
    }

    /**
     * 計算日期（yyyy/MM/dd）在該類型「當時制度」下的期別歸屬。
     * @returns {{label, isLegacyEra, from, to, year}|null}
     */
    function periodInfoForDate_(type, dateText) {
      const schedule = type.segmentSchedule;
      if (!schedule) return null;
      const year = Number(dateText.slice(0, 4));
      const month = Number(dateText.slice(5, 7));
      if (!year || !month) return null;
      const era = schedule.find(e => e.fromYear === null || year >= e.fromYear);
      if (!era) return null;
      const seg = era.segments.find(s => month >= s.from && month <= s.to);
      if (!seg) return null;
      return {
        label: year + ' 年' + seg.label,
        isLegacyEra: era.frequency !== type.frequency,
        eraFreqName: FREQ_DISPLAY_NAMES[era.frequency] || era.frequency,
        from: seg.from, to: seg.to, year: year,
      };
    }

    /** 更新登錄/補登 modal 的期別提示：歸屬期別＋同期已有紀錄的軟性提醒 */
    function updatePeriodHint_() {
      const hintEl = document.getElementById('center-form-period-hint');
      if (!centerFormState) { hintEl.innerHTML = ''; return; }
      const type = dashboard.centerTypes.find(t => t.id === centerFormState.typeId);
      const dateValue = document.getElementById('center-form-date').value; // yyyy-MM-dd
      if (!type || !type.segmentSchedule || !dateValue) { hintEl.innerHTML = ''; return; }

      const info = periodInfoForDate_(type, dateValue.replace(/-/g, '/'));
      if (!info) { hintEl.innerHTML = ''; return; }

      let html = '此日期屬 <strong>' + escapeHtml(info.label) + '</strong>' +
        (info.isLegacyEra ? '（當時為' + escapeHtml(info.eraFreqName) + '制）' : '');
      // 同期已有紀錄 → 軟性提醒（同期多次稽核合法，不阻擋）
      const samePeriod = type.records.find(function (r) {
        const y = Number(r.auditDate.slice(0, 4)), m = Number(r.auditDate.slice(5, 7));
        return y === info.year && m >= info.from && m <= info.to;
      });
      if (samePeriod) {
        html += '<span class="warn">　提醒：該期已有紀錄 ' + escapeHtml(samePeriod.auditDate) + '</span>';
      }
      hintEl.innerHTML = html;
    }

    // ---- 排定／登錄共用表單 ----
    let centerFormState = null; // {mode: 'plan'|'record', typeId}

    function openCenterForm(mode, typeId) {
      const type = dashboard.centerTypes.find(t => t.id === typeId);
      if (!type) return;
      centerFormState = { mode: mode, typeId: typeId };
      const isPlan = mode === 'plan';

      document.getElementById('center-form-title').textContent =
        (isPlan ? '排定稽核 — ' : '登錄完成 — ') + type.name;
      document.getElementById('center-form-hint').textContent = isPlan
        ? '人員與日期可分開設定（至少一項）；先排日期會立即建立行事曆預約，之後補人員會修改同一筆。修改會覆蓋原排程。'
        : '登錄實際完成日期（選過去日期即為補登歷史）；完成後若有排程將自動清除。';
      document.getElementById('center-form-date-label').textContent = isPlan ? '預定稽核日期（可留空）' : '實際稽核日期';
      document.getElementById('center-form-auditor-label').textContent =
        isPlan ? '稽核人員（可複選，可留空）' : '稽核人員（可複選，補登歷史可留空）';

      // 預設值：排定＝沿用既有排程；登錄＝今天＋既有排程人員
      const existing = type.plan;
      const preChecked = new Set(existing ? String(existing.auditorEmails).split(',').filter(Boolean) : []);
      document.getElementById('center-auditor-list').innerHTML = dashboard.auditors.length === 0
        ? '<label>HR 名單中找不到稽核人員（TF-ISPI-GRP-AUDIT 的稽核員），請先確認人員職務配置。</label>'
        : dashboard.auditors.map(function (a) {
            return '<label><input type="checkbox" value="' + escapeHtml(a.email) + '"' +
              (preChecked.has(a.email) ? ' checked' : '') + '>' +
              '<span>' + escapeHtml(a.name) + '</span><span class="email">' + escapeHtml(a.email) + '</span></label>';
          }).join('');

      const dateInput = document.getElementById('center-form-date');
      if (isPlan && existing) dateInput.value = existing.plannedDate.replace(/\//g, '-');
      else if (isPlan) dateInput.value = '';
      else dateInput.value = new Date().toISOString().slice(0, 10); // 登錄預設今天

      // 事由欄位：類型 7/8 顯示，其他隱藏
      const showReason = type.id === 'ORG' || type.id === 'ADHOC';
      document.getElementById('center-form-reason-row').classList.toggle('hidden', !showReason);
      document.getElementById('center-form-reason').value = existing && isPlan ? existing.reason : '';

      document.getElementById('center-form-error').textContent = '';
      document.getElementById('center-form-save').textContent = isPlan ? '確認排定' : '登錄完成';
      updatePeriodHint_(); // 依預設日期先顯示期別歸屬
      document.getElementById('center-form-overlay').classList.add('open');
    }

    document.getElementById('center-form-date').addEventListener('change', updatePeriodHint_);
    document.getElementById('center-form-date').addEventListener('input', updatePeriodHint_);

    function closeCenterForm() {
      document.getElementById('center-form-overlay').classList.remove('open');
      centerFormState = null;
    }

    document.getElementById('center-form-cancel').addEventListener('click', closeCenterForm);
    document.getElementById('center-form-overlay').addEventListener('click', function (e) {
      if (e.target === this) closeCenterForm();
    });

    document.getElementById('center-form-save').addEventListener('click', function () {
      const errorEl = document.getElementById('center-form-error');
      const isPlan = centerFormState.mode === 'plan';
      const checked = Array.prototype.slice
        .call(document.getElementById('center-auditor-list').querySelectorAll('input:checked'))
        .map(el => el.value);
      const dateValue = document.getElementById('center-form-date').value;
      const reason = document.getElementById('center-form-reason').value.trim();

      if (isPlan) {
        if (!dateValue && checked.length === 0) { errorEl.textContent = '請至少設定稽核人員或預定日期其中一項。'; return; }
      } else {
        if (!dateValue) { errorEl.textContent = '請選擇日期。'; return; }
      }

      const dateText = dateValue.replace(/-/g, '/');
      const typeId = centerFormState.typeId;
      const call = isPlan
        ? callServer('planCenterAudit', typeId, checked, dateText, reason)
        : callServer('recordCenterAudit', typeId, dateText, checked, reason, '');
      closeCenterForm();
      runWrite(PROGRESS_MESSAGES.center, call, applyCenterDelta);
    });

    function confirmCancelCenterPlan(typeId) {
      const type = dashboard.centerTypes.find(t => t.id === typeId);
      openModal({
        title: '取消稽核排程',
        bodyHtml: '<p>即將取消「<strong>' + escapeHtml(type.name) + '</strong>」的排程' +
          (type.plan ? '（' + escapeHtml(type.plan.plannedDate) + '）' : '') + '，狀態將退回待排定。</p>',
        confirmLabel: '確認取消排程',
        danger: true,
        onConfirm: function () {
          runWrite(PROGRESS_MESSAGES.remove, callServer('cancelCenterPlan', typeId), applyCenterDelta);
        },
      });
    }

    function confirmDeleteCenterRecord(typeId, auditDate) {
      const type = dashboard.centerTypes.find(t => t.id === typeId);
      openModal({
        title: '刪除稽核紀錄',
        bodyHtml: '<p>即將刪除「<strong>' + escapeHtml(type.name) + '</strong>」於 <strong>' +
          escapeHtml(auditDate) + '</strong> 的紀錄。此動作會立即影響本期狀態與統計，確定繼續？</p>',
        confirmLabel: '確認刪除',
        danger: true,
        onConfirm: function () {
          runWrite(PROGRESS_MESSAGES.remove,
            callServer('deleteCenterAuditRecord', typeId, auditDate), applyCenterDelta);

    // ---- 觸發事由（類型 7） ----
    function openTriggerModal() {
      document.getElementById('trigger-date').value = new Date().toISOString().slice(0, 10);
      document.getElementById('trigger-category').innerHTML = dashboard.triggerCategories
        .map(c => '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>').join('');

      document.getElementById('trigger-error').textContent = '';

    function confirmDeleteTrigger(eventId) {
      openModal({
        title: '刪除觸發事由',

        confirmLabel: '確認刪除',
        danger: true,
        onConfirm: function () {
          runWrite(PROGRESS_MESSAGES.remove, callServer('deleteTriggerEvent', eventId), applyCenterDelta);
        },

    // =============================================
    // 模式切換
    // =============================================
    document.getElementById('mode-switch').querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!dashboard || btn.dataset.mode === dashboard.mode) return;
        confirmModeSwitch(btn.dataset.mode);
      });

    function confirmModeSwitch(targetMode) {
      const explain = targetMode === 'ROLLING'
        ? '滾動式三年：每站以「上次稽核年＋3」為到期年，從未稽核過的駐站立即成為候選。'
        : '固定三年區段：以 ' + dashboard.cycle.start + '–' + dashboard.cycle.end + ' 為一輪，每輪開始時所有一般駐站重新計算。';
      openModal({
        title: '切換週期計算模式',
        bodyHtml:
          '<p>' + explain + '</p>' +
          '<p>切換後立即對<strong>所有使用者</strong>生效，駐站的候選狀態與建議數量會重新計算；稽核紀錄與分派紀錄不受影響。</p>',
        confirmLabel: '確認切換',
        danger: false,
        onConfirm: function () {
          runWriteReload(PROGRESS_MESSAGES.global, callServer('setCycleMode', targetMode));
        },
      });

    // =============================================
    // 分派流程：人員／日期可獨立設定，存檔即立即寫入
    // =============================================
    let assigningCode = null; // 分派 modal 目前操作的駐站

    function openAssignModal(stationCode) {
      const station = allStations().find(s => s.code === stationCode);
      if (!station) return;
      assigningCode = stationCode;
      const a = station.assignment;
      const existingEmails = new Set(
        a && a.auditorEmails ? String(a.auditorEmails).split(',').map(e => e.trim()).filter(Boolean) : []
      );

      document.getElementById('assign-title').textContent = '排定稽核 — ' + station.name;
      document.getElementById('auditor-list').innerHTML = dashboard.auditors.length === 0
        ? '<label>HR 名單中找不到稽核人員（TF-ISPI-GRP-AUDIT 的組員），請先確認人員職務配置。</label>'
        : dashboard.auditors.map(function (au) {
            return '<label><input type="checkbox" value="' + escapeHtml(au.email) + '"' +
              (existingEmails.has(au.email) ? ' checked' : '') + '>' +
              '<span>' + escapeHtml(au.name) + '</span><span class="email">' + escapeHtml(au.email) + '</span></label>';
          }).join('');

      // date input 需要 yyyy-MM-dd；後端與顯示用 yyyy/MM/dd，存取時轉換
      document.getElementById('assign-date').value = a && a.plannedDate ? a.plannedDate.replace(/\//g, '-') : '';
      document.getElementById('assign-error').textContent = '';
      document.getElementById('assign-overlay').classList.add('open');
    }

    function closeAssignModal() {
      document.getElementById('assign-overlay').classList.remove('open');
      assigningCode = null;
    }

    document.getElementById('assign-cancel').addEventListener('click', closeAssignModal);
    document.getElementById('assign-overlay').addEventListener('click', function (e) {
      if (e.target === this) closeAssignModal();
    });

    document.getElementById('assign-save').addEventListener('click', function () {
      const errorEl = document.getElementById('assign-error');
      const checked = Array.prototype.slice
        .call(document.getElementById('auditor-list').querySelectorAll('input:checked'))
        .map(el => el.value);
      const dateValue = document.getElementById('assign-date').value; // yyyy-MM-dd

      if (checked.length === 0 && !dateValue) {
        errorEl.textContent = '請至少設定稽核人員或預計稽核日期其中一項。';
        return;
      }

      const code = assigningCode, year = dashboard.currentYear;
      const call = callServer('saveStationAssignment', code, year, checked, dateValue.replace(/-/g, '/'));
      closeAssignModal();
      runWrite(PROGRESS_MESSAGES.assign, call, applyStationDelta);
    });

    // =============================================
    // 補登歷史稽核紀錄
    // =============================================
    const MIN_BACKFILL_YEAR = 2000; // 與後端 ENV.MIN_AUDIT_YEAR 一致

    let backfillingCode = null; // 補登 modal 目前操作的駐站

    function openBackfillModal(stationCode) {
      const station = allStations().find(s => s.code === stationCode);
      if (!station) return;
      backfillingCode = stationCode;

      document.getElementById('backfill-title').textContent = '登錄完成／補登 — ' + station.name;
      // 預設今天，最常見的「今天完成」可一鍵送出；選過去日期即為補登歷史
      document.getElementById('backfill-date').value = new Date().toISOString().slice(0, 10);
      document.getElementById('backfill-hint').innerHTML = '';
      validateBackfillDate_(); // 預填今天後先跑一次年度檢核提示
      document.getElementById('backfill-error').textContent = '';
      document.getElementById('backfill-overlay').classList.add('open');
    }

    function closeBackfillModal() {
      document.getElementById('backfill-overlay').classList.remove('open');
      backfillingCode = null;
    }

    /** 補登日期即時檢核：該年度已有紀錄則提示並擋存（每站每年僅計一筆） */
    function validateBackfillDate_() {
      const hintEl = document.getElementById('backfill-hint');
      const dateValue = document.getElementById('backfill-date').value; // yyyy-MM-dd
      if (!backfillingCode || !dateValue) { hintEl.innerHTML = ''; return true; }

      const station = allStations().find(s => s.code === backfillingCode);
      const year = Number(dateValue.slice(0, 4));
      if (year < MIN_BACKFILL_YEAR || year > dashboard.currentYear) {
        hintEl.innerHTML = '<span class="warn">年度需介於 ' + MIN_BACKFILL_YEAR + '～' + dashboard.currentYear + '。</span>';
        return false;
      }
      const existing = station.auditRecords.find(r => r.year === year);
      if (existing) {
        hintEl.innerHTML = '<span class="warn">' + year + ' 年已有紀錄（' +
          escapeHtml(existing.auditDate || existing.year + ' 年') + '），同一駐站每年僅計一筆。</span>';
        return false;
      }
      hintEl.textContent = '將登錄為 ' + year + ' 年的稽核紀錄。';
      return true;
    }

    document.getElementById('backfill-date').addEventListener('change', validateBackfillDate_);
    document.getElementById('backfill-date').addEventListener('input', validateBackfillDate_);

    document.getElementById('backfill-cancel').addEventListener('click', closeBackfillModal);
    document.getElementById('backfill-overlay').addEventListener('click', function (e) {
      if (e.target === this) closeBackfillModal();
    });

    document.getElementById('backfill-save').addEventListener('click', function () {
      const errorEl = document.getElementById('backfill-error');
      const dateValue = document.getElementById('backfill-date').value;
      if (!dateValue) { errorEl.textContent = '請選擇稽核日期。'; return; }
      if (!validateBackfillDate_()) { errorEl.textContent = '請修正日期後再送出。'; return; }

      const dateText = dateValue.replace(/-/g, '/');
      const code = backfillingCode;
      const call = callServer('recordAudits', [code], Number(dateText.slice(0, 4)), dateText);
      closeBackfillModal();
      runWrite(PROGRESS_MESSAGES.record, call, applyStationDelta);
    });

    // ---- 歷年稽核紀錄（點擊駐站卡片開啟） ----
    // ---- 統一歷年紀錄彈窗（駐站／中心共用；紀錄檢視＋刪除＋補登入口） ----
    let historyModalState = null; // { kind: 'station'|'center', id }

    function openHistoryModal(kind, id) {
      historyModalState = { kind: kind, id: id };
      renderHistoryBody_();
      document.getElementById('history-overlay').classList.add('open');
    }

    function closeHistoryModal() {
      document.getElementById('history-overlay').classList.remove('open');
      historyModalState = null;
    }

    function renderHistoryBody_() {
      if (!historyModalState) return;
      const titleEl = document.getElementById('history-title');
      const bodyEl = document.getElementById('history-body');
      const backfillBtn = document.getElementById('history-backfill');

      if (historyModalState.kind === 'station') {
        const station = allStations().find(s => s.code === historyModalState.id);
        if (!station) { closeHistoryModal(); return; }
        titleEl.textContent = '歷年稽核紀錄 — ' + station.name;
        bodyEl.innerHTML = renderStationHistoryRows_(station);
        backfillBtn.textContent = '登錄完成／補登';
      } else {
        const type = dashboard.centerTypes.find(t => t.id === historyModalState.id);
        if (!type) { closeHistoryModal(); return; }
        titleEl.textContent = '歷年稽核紀錄 — ' + type.name;
        bodyEl.innerHTML = renderCenterHistoryRows_(type);
        backfillBtn.textContent = '登錄完成／補登';
      }
      bindHistoryDeleteEvents_();
    }

    function renderStationHistoryRows_(station) {
      if (station.auditRecords.length === 0) {
        return '<p class="empty-hist">此駐站尚無稽核紀錄，可由下方「登錄完成／補登」新增。</p>';
      }
      const countedYear = station.evaluation.countedYear;
      // 認證站：標示紀錄落在認證任期內（計入兩年輪）或升認證前（只進三年總覽）
      const certSince = station.isCertified ? (station.certifiedSince || 0) : 0;
      return '<ul class="history-list">' + station.auditRecords.map(function (r) {
        const dateText = r.auditDate
          ? '<span class="mono">' + escapeHtml(r.auditDate) + '</span>'
          : '<span class="mono">' + r.year + ' 年</span><span class="hist-tag">僅年度</span>';
        const countedTag = (r.year === countedYear) ? '<span class="hist-tag counted">計入週期</span>' : '';
        const certTag = certSince ? (r.year >= certSince
          ? '<span class="hist-tag cert-in">認證期內</span>'
          : '<span class="hist-tag cert-pre">升認證前</span>') : '';
        return '<li><span class="hist-main">' + dateText + countedTag + certTag +
          (r.recorder ? '　<span class="mono dim">' + escapeHtml(r.recorder) + '</span>' : '') +
          (r.note ? '　' + escapeHtml(r.note) : '') + '</span>' +
          '<button class="hist-del" data-del-kind="station" data-code="' + escapeHtml(station.code) +
          '" data-year="' + r.year + '" title="刪除此筆紀錄" aria-label="刪除 ' + r.year + ' 年紀錄">×</button></li>';
      }).join('') + '</ul>';
    }

    function renderCenterHistoryRows_(type) {
      if (type.records.length === 0) {
        return '<p class="empty-hist">此項目尚無稽核紀錄，可由下方「登錄完成／補登」新增。</p>';
      }
      return '<ul class="history-list">' + type.records.map(function (r) {
        const periodTag = r.periodLabel ? '<span class="hist-tag">' + escapeHtml(r.periodLabel) + '</span>' : '';
        return '<li><span class="hist-main"><span class="mono">' + escapeHtml(r.auditDate) + '</span>' + periodTag +
          (r.auditorNames ? '　' + escapeHtml(r.auditorNames) : '') +
          (r.reason ? '　<span class="dim">' + escapeHtml(r.reason) + '</span>' : '') +
          (r.note ? '　' + escapeHtml(r.note) : '') + '</span>' +
          '<button class="hist-del" data-del-kind="center" data-type="' + escapeHtml(type.id) +
          '" data-date="' + escapeHtml(r.auditDate) + '" title="刪除此筆紀錄">×</button></li>';
      }).join('') + '</ul>';
    }

    function bindHistoryDeleteEvents_() {
      document.getElementById('history-body').querySelectorAll('.hist-del').forEach(function (el) {
        el.addEventListener('click', function () {
          if (el.dataset.delKind === 'station') confirmDeleteRecord(el.dataset.code, Number(el.dataset.year));
          else confirmDeleteCenterRecord(el.dataset.type, el.dataset.date);
        });
      });
    }

    /** loadDashboard 完成後，若歷年彈窗開著則以最新資料重繪（刪除/補登後即時更新） */
    function refreshHistoryBody_() {
      if (historyModalState && document.getElementById('history-overlay').classList.contains('open')) {
        renderHistoryBody_();
      }
    }

    document.getElementById('history-close').addEventListener('click', closeHistoryModal);
    document.getElementById('history-overlay').addEventListener('click', function (e) {
      if (e.target === this) closeHistoryModal();
    });
    document.getElementById('history-backfill').addEventListener('click', function () {
      if (!historyModalState) return;
      if (historyModalState.kind === 'station') openBackfillModal(historyModalState.id);
      else openCenterForm('record', historyModalState.id);
    });

    // =============================================
    // 稽核紀錄匯出／匯入
    // =============================================
    let importScope = null; // 目前匯入操作的範圍（檔案選取後使用）

    document.querySelectorAll('[data-export]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        triggerExport_(btn.dataset.export, btn.dataset.format, btn);
      });
    });

    /** base64 → Blob → 觸發瀏覽器下載（client-side，不受 GAS sandbox 限制） */
    function downloadBase64_(base64, filename, mimeType) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([bytes], { type: mimeType }));
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

      const scope = importScope;

      reader.onload = function () { confirmImport_(scope, String(reader.result), file.name); };
      reader.readAsText(file, 'UTF-8');
    });

    /** 前端版週期區段計算（與後端 getCycleForYear 同式），供設定預覽即時顯示 */
    function getCycleForCurrentYear_(anchorYear) {

      return { start: start, end: start + LENGTH - 1 };

    /** 依草稿名單重繪：統計、選定格、選項清單、異動摘要、更新鈕狀態 */
    function renderCertifiedModal_() {
      const expected = certState.expectedCount;
      const draft = certState.draftCodes;
      const byCode = {};
      certState.options.forEach(s => { byCode[s.code] = s; });

      // 統計列
      const remain = expected - draft.size;
      const statEl = document.getElementById('cert-stat');
      let statTail;
      if (draft.size > expected) statTail = '<span class="need">已超過 ' + (draft.size - expected) + ' 家，請移除</span>';
      else if (remain > 0) statTail = '<span class="need">還差 ' + remain + ' 家</span>';
      else statTail = '<span class="full">已選滿</span>';
      statEl.innerHTML = '已選 <strong>' + draft.size + '/' + expected + '</strong> 家　·　' + statTail;

      // 選定格（固定 expected 格，依序填入草稿成員，其餘空格）
      const selectedCodes = Array.from(draft);
      const slots = [];
      for (let i = 0; i < expected; i++) {
        const s = selectedCodes[i] ? byCode[selectedCodes[i]] : null;
        if (s) {
          const certTag = s.certCount > 0 ? '<span class="hist-tag cert-in">認證 ' + s.certCount + ' 次</span>' : '';
          slots.push(
            '<div class="cert-slot">' +
              '<div class="info">' +
                '<div class="s-name">' + escapeHtml(s.name) + certTag + '</div>' +
                '<div class="s-meta">' + escapeHtml(s.code) + '</div>' +
                '<div class="s-manager">負責人：' + escapeHtml(s.managerName || '未設定') + '</div>' +
              '</div>' +
              '<button class="btn-sm btn-remove" data-cert-remove="' + escapeHtml(s.code) + '">移除</button>' +
            '</div>'
          );
        } else {
          slots.push('<div class="cert-slot empty">尚未選定</div>');
        }
      }
      document.getElementById('certified-selected-list').innerHTML = slots.join('');

      // 選項清單（依搜尋過濾）
      const q = document.getElementById('certified-search-input').value.trim().toLowerCase();
      const matched = certState.options.filter(function (s) {
        if (!q) return true;
        return (s.name + ' ' + s.code + ' ' + (s.managerName || '')).toLowerCase().indexOf(q) !== -1;
      });
      const listEl = document.getElementById('certified-option-list');
      if (matched.length === 0) {
        listEl.innerHTML = '<div class="cert-empty-hint">查無符合「' + escapeHtml(q) + '」的駐站</div>';
      } else {
        listEl.innerHTML = matched.map(function (s) {
          const on = draft.has(s.code);
          const certTag = s.certCount > 0 ? ' <span class="hist-tag cert-in">認證 ' + s.certCount + ' 次</span>' : '';
          return '<div class="cert-option' + (on ? ' selected' : '') + '" data-cert-toggle="' + escapeHtml(s.code) + '">' +
            '<span class="check">' + (on ? '✓' : '') + '</span>' +
            '<span class="o-name">' + escapeHtml(s.name) + certTag +
              '<span class="s-manager">　' + escapeHtml(s.managerName || '未設定') + '</span></span>' +
            '<span class="o-meta">' + escapeHtml(s.code) + '</span>' +
          '</div>';
        }).join('');
      }

      // 異動摘要
      const added = Array.from(draft).filter(c => !certState.originalCodes.has(c));
      const removed = Array.from(certState.originalCodes).filter(c => !draft.has(c));
      const chips = added.map(c => '<span class="cert-diff-chip add">＋ ' + escapeHtml((byCode[c] || {}).name || c) + '</span>')
        .concat(removed.map(c => '<span class="cert-diff-chip remove">－ ' + escapeHtml((byCode[c] || {}).name || c) + '</span>'));
      document.getElementById('certified-diff').innerHTML = chips.join('') || '<span class="s-manager">尚無異動</span>';

      // 更新鈕：剛好 expected 家且有異動才啟用
      const hasDiff = added.length > 0 || removed.length > 0;
      document.getElementById('certified-submit-btn').disabled = !(draft.size === expected && hasDiff);
    }

      // ---- 預覽用：延遲回應 + 部分更新 delta（與後端 stationDeltaFor_／centerDeltaFor_ 對齊） ----
      function delayed_(obj, ms) { return new Promise(function (r) { setTimeout(function () { r(obj); }, ms); }); }
      function stationDelta_(codes, message) {
        const d = computeDashboard_();
        const all = d.certifiedStations.concat(d.normalStations);
        return { message: message, stations: all.filter(function (s) { return codes.indexOf(s.code) >= 0; }), summary: d.summary };
      }
      function centerDelta_(typeId, message) {
        const d = computeDashboard_();
        return { message: message, centerType: d.centerTypes.find(function (t) { return t.id === typeId; }) || null, centerSummary: d.centerSummary };
      }

      // 預覽用角色模擬：?role=viewer 或 ?role=forbidden 可驗證權限控管（預設 auditor）
      const previewRole = (function () {
        const r = (new URLSearchParams(location.search).get('role') || 'auditor').toUpperCase();
        return ['AUDITOR', 'VIEWER', 'FORBIDDEN'].indexOf(r) >= 0 ? r : 'AUDITOR';
      })();
      const WRITE_FNS = ['saveStationAssignment', 'cancelAssignment', 'recordAudits', 'deleteAuditRecord',
        'planCenterAudit', 'cancelCenterPlan', 'recordCenterAudit', 'deleteCenterAuditRecord',
        'addTriggerEvent', 'deleteTriggerEvent', 'setCycleMode', 'setCycleStartYear', 'importAuditRecords',
        'saveCertifiedStations'];
      if (fnName === 'getAuditDashboard' && previewRole === 'FORBIDDEN') {
        return Promise.reject(new Error('權限不足：駐站人員無法存取稽核駐站分配系統'));
      }
      // 認證駐站管理（讀＋寫）皆限稽核員
      if (fnName === 'getCertifiedStationData' && previewRole !== 'AUDITOR') {
        return Promise.reject(new Error('權限不足：僅稽核員可執行此操作'));
      }
      if (WRITE_FNS.indexOf(fnName) >= 0 && previewRole !== 'AUDITOR') {
        return Promise.reject(new Error('權限不足：僅稽核員可執行此操作'));
      }

      if (fnName === 'getCertifiedStationData') {
        const opts = stations.map(function (st) {
          const auditYears = state.records.filter(r => r.stationCode === st.code).map(r => r.year);
          return {
            code: st.code, name: st.name, managerName: st.managerName || '',
            isCertified: !!st.isCertified, certifiedSince: st.certifiedSince || 0,
            certCount: countValidCertifications_(st.certifiedTenures || [], auditYears),
          };
        });
        return delayed_({
          expectedCount: 6, externalTableReady: true,
          currentCertified: opts.filter(s => s.isCertified),
          stationOptions: opts,
        }, 400);
      }
      if (fnName === 'saveCertifiedStations') {
        const codes = (args[0] || []).map(c => String(c).trim()).filter(Boolean);
        if (codes.length !== 6) return Promise.reject(new Error('認證駐站須剛好 6 家，目前選了 ' + codes.length + ' 家'));
        state.certifiedCodes = codes;
        return delayed_({ message: '【預覽模式】已更新認證駐站名單' }, 600);
      }

      if (fnName === 'setCycleMode') {
        state.mode = args[0];
        return Promise.resolve({ mode: state.mode, message: '【預覽模式】已切換週期模式' });
      }
      if (fnName === 'setCycleStartYear') {
        state.cycleStartYear = args[0];
        return Promise.resolve({ cycleStartYear: args[0], message: '【預覽模式】已將週期起始年設為 ' + args[0] });
      }
      if (fnName === 'recordAudits') {
        // 與後端同邏輯：未帶日期且登錄今年時自動填當天
        const auditDate = args[2] || (args[1] === currentYear ? new Date().toISOString().slice(0, 10).replace(/-/g, '/') : '');
        args[0].forEach(code => state.records.push({ stationCode: code, year: args[1], auditDate: auditDate }));
        return delayed_(stationDelta_(args[0], '【預覽模式】已登錄 ' + args[0].length + ' 間駐站'), 600);
      }
      if (fnName === 'deleteAuditRecord') {
        const idx = state.records.findIndex(r => r.stationCode === args[0] && r.year === args[1]);
        if (idx >= 0) state.records.splice(idx, 1);
        return delayed_(stationDelta_([args[0]], '【預覽模式】已刪除紀錄'), 600);
      }
      if (fnName === 'saveStationAssignment') {
        const emailToName = {};
        auditors.forEach(a => { emailToName[a.email] = a.name; });
        const code = args[0], yr = args[1];
        const emails = (args[2] || []).filter(Boolean);
        const date = String(args[3] || '').trim();
        if (emails.length === 0 && !date) {
          return Promise.reject(new Error('請至少設定稽核人員或預計稽核日期其中一項'));
        }
        const existing = state.assignments.find(p => p.stationCode === code && p.year === yr);
        const oldEventId = existing ? existing.calendarEventId : '';
        let eventId = oldEventId || '';
        let calMsg = '';
        if (date) {
          if (oldEventId) { eventId = oldEventId; calMsg = '，已更新同一日曆事件（' + eventId + '）'; }
          else { eventId = 'mock-evt-' + Date.now(); calMsg = '，已建立日曆預約（' + eventId + '）'; }
        } else {
          if (oldEventId) calMsg = '，已移除原日曆事件';
          eventId = '';
        }
        state.assignments = state.assignments.filter(p => !(p.stationCode === code && p.year === yr));
        state.assignments.push({
          stationCode: code, year: yr,
          auditorNames: emails.map(e => emailToName[e] || e).join('、'),
          auditorEmails: emails.join(','),
          plannedDate: date,
          calendarEventId: eventId,
        });
        let msg;
        if (date && emails.length > 0) msg = '【預覽模式】已分派 ' + code + calMsg;
        else if (date) msg = '【預覽模式】已排定日期（待指派人員）' + calMsg;
        else msg = '【預覽模式】已指派人員（待定日期，僅寫入試算表，尚未進日曆）';
        return delayed_(stationDelta_([code], msg), 600);
      }
      if (fnName === 'cancelAssignment') {
        state.assignments = state.assignments.filter(p => !(p.stationCode === args[0] && p.year === args[1]));
        return delayed_(stationDelta_([args[0]], '【預覽模式】已取消分派，已同步行事曆'), 600);
      }

      // ---- 中心稽核 API（與 code.js 同邏輯的精簡版）----
      const typeNameOf = id => (AUDIT_TYPE_DEFS.find(t => t.id === id) || {}).name || id;
      const auditorNamesOf = emails => emails.map(e => (auditors.find(a => a.email === e) || { name: e }).name).join('、');
      if (fnName === 'planCenterAudit') {
        const emails = (args[1] || []).filter(Boolean);
        const date = String(args[2] || '').trim();
        if (emails.length === 0 && !date) {
          return Promise.reject(new Error('請至少設定稽核人員或預定日期其中一項'));
        }
        const existing = state.centerPlans.find(p => p.typeId === args[0]);
        const oldEventId = existing ? existing.calendarEventId : '';
        let eventId = oldEventId || '';
        let calMsg = '';
        if (date) {
          if (oldEventId) { eventId = oldEventId; calMsg = '，已更新同一日曆事件（' + eventId + '）'; }
          else { eventId = 'mock-evt-' + Date.now(); calMsg = '，已建立日曆預約（' + eventId + '）'; }
        } else { eventId = ''; if (oldEventId) calMsg = '，已移除原日曆事件'; }
        state.centerPlans = state.centerPlans.filter(p => p.typeId !== args[0]);
        state.centerPlans.push({ typeId: args[0], plannedDate: date, auditorNames: auditorNamesOf(emails), auditorEmails: emails.join(','), reason: args[3] || '', calendarEventId: eventId });
        let msg;
        if (date && emails.length > 0) msg = '【預覽模式】已排定「' + typeNameOf(args[0]) + '」於 ' + date + ' 稽核' + calMsg;
        else if (date) msg = '【預覽模式】已為「' + typeNameOf(args[0]) + '」排定日期（待指派人員）' + calMsg;
        else msg = '【預覽模式】已為「' + typeNameOf(args[0]) + '」指派人員（待定日期，尚未進日曆）';
        return delayed_(centerDelta_(args[0], msg), 600);
      }
      if (fnName === 'cancelCenterPlan') {
        state.centerPlans = state.centerPlans.filter(p => p.typeId !== args[0]);
        return delayed_(centerDelta_(args[0], '【預覽模式】已取消排程，已同步行事曆'), 600);
      }
      if (fnName === 'recordCenterAudit') {
        if (state.centerRecords.some(r => r.typeId === args[0] && r.auditDate === args[1])) {
          return Promise.reject(new Error('「' + typeNameOf(args[0]) + '」於 ' + args[1] + ' 已有紀錄，請勿重複登錄'));
        }
        state.centerRecords.push({ typeId: args[0], auditDate: args[1], auditorNames: auditorNamesOf(args[2] || []), reason: args[3] || '', note: '' });
        state.centerPlans = state.centerPlans.filter(p => p.typeId !== args[0]); // 完成後清排程
        return delayed_(centerDelta_(args[0], '【預覽模式】已登錄「' + typeNameOf(args[0]) + '」於 ' + args[1] + ' 完成稽核'), 600);
      }
      if (fnName === 'deleteCenterAuditRecord') {
        state.centerRecords = state.centerRecords.filter(r => !(r.typeId === args[0] && r.auditDate === args[1]));
        return delayed_(centerDelta_(args[0], '【預覽模式】已刪除紀錄'), 600);
      }
      if (fnName === 'addTriggerEvent') {
        state.triggers.push({ eventId: 'TRG-' + Date.now(), eventDate: args[0], category: args[1], description: args[2] || '' });
        return delayed_(centerDelta_('ORG', '【預覽模式】已登記觸發事由「' + args[1] + '」'), 600);
      }
      if (fnName === 'deleteTriggerEvent') {
        state.triggers = state.triggers.filter(t => t.eventId !== args[0]);
        return delayed_(centerDelta_('ORG', '【預覽模式】已刪除觸發事由'), 600);
      }
      if (fnName === 'exportAuditRecords' || fnName === 'importAuditRecords') {
        // 與 code.js getExportView_ 同構：駐站／中心各自的欄位、紀錄、去重鍵與寫入
        const stationNameOf = code => (stations.find(s => s.code === code) || {}).name || '';
        const view = (args[0] === 'center') ? {
          label: '中心稽核紀錄', columns: CENTER_CSV_COLUMNS,
          records: state.centerRecords.map(r => ({
            typeId: r.typeId, typeName: typeNameOf(r.typeId), auditDate: r.auditDate,
            auditorNames: r.auditorNames, reason: r.reason || '', note: r.note || '',
          })),
          keyFn: r => r.typeId + '|' + r.auditDate,
          add: rec => state.centerRecords.push({
            typeId: rec.typeId, auditDate: rec.auditDate, auditorNames: rec.auditorNames,
            reason: rec.reason || '', note: rec.note || '',
          }),
        } : {
          label: '駐站收案稽核紀錄', columns: STATION_CSV_COLUMNS,
          records: state.records.map(r => ({
            stationCode: r.stationCode, stationName: stationNameOf(r.stationCode), year: r.year,
            auditDate: r.auditDate || '', recorder: r.recorder || '', note: r.note || '',
          })),
          keyFn: r => r.stationCode + '|' + r.year,
          add: rec => state.records.push({
            stationCode: rec.stationCode, year: Number(rec.year) || rec.year,
            auditDate: rec.auditDate || '', recorder: rec.recorder || '', note: rec.note || '',
          }),
        };

        if (fnName === 'exportAuditRecords') {
          const csv = toCsv(recordsToRows(view.records, view.columns));
          const contentBase64 = btoa(unescape(encodeURIComponent('﻿' + csv)));
          const stamp = new Date().toISOString().slice(0, 10);
          return Promise.resolve({
            filename: view.label + '-' + stamp + '.csv',
            mimeType: 'text/csv', contentBase64: contentBase64,
          });
        }
        // importAuditRecords：args[1] 為 CSV 文字
        const parsed = rowsToRecords(parseCsv(args[1]), view.columns);
        if (parsed.missingHeaders.length) {
          return Promise.reject(new Error('CSV 表頭缺漏：' + parsed.missingHeaders.join('、')));
        }
        const merged = mergeImport(view.records, parsed.records, view.keyFn);
        merged.toAdd.forEach(view.add);
        return Promise.resolve({
          added: merged.toAdd.length, skipped: merged.skipped.length,
          message: '【預覽模式】已匯入 ' + merged.toAdd.length + ' 筆，跳過 ' + merged.skipped.length + ' 筆重複',
        });
      }

      // getAuditDashboard：與 code.js 相同的組裝流程
      return delayed_(computeDashboard_(), 350);

      // 組裝整份儀表板（部分更新 delta 亦複用此結果）；函式宣告在 mockServer 內提升
      function computeDashboard_() {
      const assignmentByStation = {};
      state.assignments.forEach(p => { if (p.year === currentYear) assignmentByStation[p.stationCode] = p; });

      const evaluated = stations.map(function (st) {
        const stationRecords = state.records.filter(r => r.stationCode === st.code);
        const years = stationRecords.map(r => r.year);
        const evaluation = evaluateStationFor_(st, years, currentYear, cycle, certifiedCycle, state.mode);
        const assignment = assignmentByStation[st.code] || null;
        if (assignment && evaluation.status !== STATION_STATUS.AUDITED_THIS_YEAR) {
          evaluation.status = STATION_STATUS.PENDING_AUDIT;
        }
        // 與後端 buildStationAuditView_ 同邏輯：倒序＋上次稽核顯示文字
        const sortedRecords = stationRecords.slice().sort(function (a, b) {
          if (a.year !== b.year) return b.year - a.year;
          return String(b.auditDate || '').localeCompare(String(a.auditDate || ''));
        });
        const latest = sortedRecords[0] || null;
        return Object.assign({}, st, {
          alias: '', managerEmail: '',
          allAuditYears: years.slice().sort(),
          auditRecords: sortedRecords.map(r => ({ year: r.year, auditDate: r.auditDate || '', recorder: 'preview@local', note: '' })),
          lastAuditDisplay: latest ? (latest.auditDate || latest.year + ' 年') : '',
          assignment: assignment && { auditorNames: assignment.auditorNames, auditorEmails: assignment.auditorEmails, plannedDate: assignment.plannedDate },
          history: buildAuditHistory(years, currentYear),
          evaluation: evaluation,
        });
      });

      const summary = buildCycleSummary(evaluated, currentYear, cycle, certifiedCycle, state.mode);
      summary.plannedThisYear = Object.keys(assignmentByStation).length;
      summary.auditedThisYear = evaluated.filter(s => s.evaluation.auditedThisYear).length;

      // 中心稽核儀表板（與 code.js 的 buildCenterDashboard_ 同流程，走真實純函式）
      const todayParts = { year: currentYear, month: new Date().getMonth() + 1 };
      const orgDates = state.centerRecords.filter(r => r.typeId === 'ORG').map(r => r.auditDate);
      const resolvedTriggers = resolveTriggerEvents(state.triggers, orgDates)
        .sort((a, b) => a.eventDate < b.eventDate ? 1 : -1);
      const openCount = resolvedTriggers.filter(t => !t.resolved).length;
      const centerTypes = AUDIT_TYPE_DEFS.filter(t => t.frequency !== 'STATION').map(function (typeDef) {
        const records = state.centerRecords.filter(r => r.typeId === typeDef.id)
          .sort((a, b) => a.auditDate < b.auditDate ? 1 : -1);
        const plan = state.centerPlans.find(p => p.typeId === typeDef.id) || null;
        const open = typeDef.id === 'ORG' ? openCount : 0;
        return {
          id: typeDef.id, order: typeDef.order, name: typeDef.name,
          frequency: typeDef.frequency, freqLabel: typeDef.freqLabel,
          records: records.map(r => Object.assign({}, r, { periodLabel: getPeriodLabelForDate(typeDef, r.auditDate) })),
          plan: plan,
          triggers: typeDef.id === 'ORG' ? resolvedTriggers : null,
          openTriggerCount: open,
          segmentSchedule: getSegmentScheduleForType(typeDef),
          evaluation: evaluateCenterType(typeDef, records.map(r => r.auditDate), plan, open, todayParts, state.cycleStartYear, state.mode),
        };
      });

      return {
        currentYear: currentYear, mode: state.mode, cycleStartYear: state.cycleStartYear, cycle: cycle, certifiedCycle: certifiedCycle, summary: summary, auditors: auditors,
        certifiedStations: evaluated.filter(s => s.isCertified),
        normalStations: evaluated.filter(s => !s.isCertified),
        centerTypes: centerTypes,
        centerSummary: buildCenterSummary(centerTypes),
        triggerCategories: TRIGGER_CATEGORIES,
        userEmail: 'preview@local',
        userRole: previewRole,
      };
      }
    }

    // 啟動
    loadDashboard();
  </script>
</body>
